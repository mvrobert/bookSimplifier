    const QUIZ_DATA = {"title": "Light - Reflection and Refraction - Kid-friendly science workshop with tiny lessons and quick quizzes", "version": "1.0", "totalQuestions": 32, "modules": [{"id": 0, "name": "M0: Light Helps Us See", "questions": [{"question": "How do we usually see an object?", "options": ["Light from the object reaches our eyes", "The object makes sound only", "The object always glows by itself", "The object turns into air"], "answer": 0, "explanation": "We see because reflected or transmitted light enters the eye.", "id": "q0_1"}, {"question": "What is reflection of light?", "options": ["Light bouncing from a surface", "Light melting into water", "Light disappearing completely", "Light becoming a sound wave"], "answer": 0, "explanation": "Reflection is the bouncing back of light from a surface.", "id": "q0_2"}, {"question": "Which law says the incoming angle equals the outgoing angle?", "options": ["Angle of incidence equals angle of reflection", "Angle of incidence is always zero", "The normal is a mirror", "The reflected ray bends toward the mirror"], "answer": 0, "explanation": "This is one of the two laws of reflection.", "id": "q0_3"}, {"question": "What do the incident ray, normal, and reflected ray do?", "options": ["They lie in the same plane", "They make a triangle only", "They must be parallel", "They cannot touch the mirror"], "answer": 0, "explanation": "The chapter states this as the second law of reflection.", "id": "q0_4"}, {"question": "What kind of image is formed by a plane mirror?", "options": ["Virtual and erect", "Real and upside down only", "Always tiny and black", "Only a shadow"], "answer": 0, "explanation": "A plane mirror forms a virtual, erect image.", "id": "q0_5"}, {"question": "What does lateral inversion mean?", "options": ["Left and right appear swapped", "The image becomes invisible", "Top and bottom disappear", "The mirror changes color"], "answer": 0, "explanation": "Plane mirrors reverse left-right appearance.", "id": "q0_6"}, {"question": "Why is a dark room hard to see in?", "options": ["Not enough light reaches the eyes", "The walls become liquid", "Sound stops working", "The mirror laws change"], "answer": 0, "explanation": "Visibility depends on light reaching the eye.", "id": "q0_7"}, {"question": "Which word best matches light bouncing off a polished surface?", "options": ["Reflection", "Evaporation", "Freezing", "Filtration"], "answer": 0, "explanation": "Reflection is the correct term.", "id": "q0_8"}]}, {"id": 1, "name": "M1: Curved Mirrors and Images", "questions": [{"question": "Which curved mirror bends inward like the inside of a spoon?", "options": ["Concave mirror", "Convex mirror", "Flat mirror", "Broken mirror"], "answer": 0, "explanation": "A concave mirror curves inward.", "id": "q1_1"}, {"question": "Which curved mirror bends outward like the back of a spoon?", "options": ["Convex mirror", "Concave mirror", "Plane mirror", "Polished stone"], "answer": 0, "explanation": "A convex mirror curves outward.", "id": "q1_2"}, {"question": "What is the point at the middle of a spherical mirror called?", "options": ["Pole", "Pupil", "Pixel", "Prism"], "answer": 0, "explanation": "The pole is the centre point of the mirror surface.", "id": "q1_3"}, {"question": "What does a concave mirror do to rays parallel to its axis?", "options": ["It can bring them together at the focus", "It always sends them straight through", "It makes them stop", "It turns them into sound"], "answer": 0, "explanation": "A concave mirror can converge parallel rays.", "id": "q1_4"}, {"question": "Why are convex mirrors used as rear-view mirrors?", "options": ["They give a wider field of view", "They make everything huge", "They reverse electricity", "They remove reflections"], "answer": 0, "explanation": "Convex mirrors help drivers see more behind them.", "id": "q1_5"}, {"question": "What does magnification compare?", "options": ["Image height with object height", "Mirror size with room size", "Light speed with sound speed", "Colour with temperature"], "answer": 0, "explanation": "Magnification is the ratio of image height to object height.", "id": "q1_6"}, {"question": "Which mirror usually forms a virtual and smaller image?", "options": ["Convex mirror", "Concave mirror", "Plane mirror", "Water surface"], "answer": 0, "explanation": "Convex mirrors usually form virtual, erect, diminished images.", "id": "q1_7"}, {"question": "In the mirror formula 1/v + 1/u = 1/f, what does f mean?", "options": ["Focal length", "Field length", "Final angle", "Frame size"], "answer": 0, "explanation": "f stands for focal length.", "id": "q1_8"}]}, {"id": 2, "name": "M2: Refraction in Glass", "questions": [{"question": "What is refraction?", "options": ["Bending of light when it enters a new medium", "Light turning into heat only", "Light vanishing completely", "Light stopping at the surface"], "answer": 0, "explanation": "Refraction is the bending of light at a boundary.", "id": "q2_1"}, {"question": "When light goes from air to glass, it usually bends", "options": ["Toward the normal", "Away from the normal", "Into a circle", "It does not bend at all"], "answer": 0, "explanation": "Air to glass is from rarer to denser, so the ray bends toward the normal.", "id": "q2_2"}, {"question": "When light goes from glass to air, it usually bends", "options": ["Away from the normal", "Toward the normal", "Only upward", "Only downward"], "answer": 0, "explanation": "Glass to air is from denser to rarer, so the ray bends away from the normal.", "id": "q2_3"}, {"question": "What does a rectangular glass slab do to the emergent ray?", "options": ["It makes it parallel to the incident ray", "It makes it always perpendicular", "It turns it into a shadow", "It removes the ray"], "answer": 0, "explanation": "The emergent ray is parallel, but laterally displaced.", "id": "q2_4"}, {"question": "Why does a pencil in water look bent?", "options": ["Light from the submerged part changes direction", "The pencil becomes soft", "Water pushes the pencil", "The eye closes one side"], "answer": 0, "explanation": "Refraction makes the underwater part appear shifted.", "id": "q2_5"}, {"question": "What is lateral displacement?", "options": ["A sideways shift of the emergent ray", "A change in colour", "A change in mass", "A change in sound"], "answer": 0, "explanation": "A glass slab shifts the ray sideways.", "id": "q2_6"}, {"question": "What does refractive index help compare?", "options": ["How strongly different media bend light", "How loud different media are", "How hot different media are", "How fast a pencil floats"], "answer": 0, "explanation": "Refractive index is tied to how much a medium slows light.", "id": "q2_7"}, {"question": "Why do different materials bend light by different amounts?", "options": ["Because their refractive indices differ", "Because all light is the same everywhere", "Because mirrors are inside them", "Because temperature is always zero"], "answer": 0, "explanation": "Different media have different refractive indices.", "id": "q2_8"}]}, {"id": 3, "name": "M3: Lenses and Focus", "questions": [{"question": "Which lens type converges light rays?", "options": ["Convex lens", "Concave lens", "Plane glass sheet", "Water puddle"], "answer": 0, "explanation": "A convex lens brings rays together.", "id": "q3_1"}, {"question": "Which lens type diverges light rays?", "options": ["Concave lens", "Convex lens", "Mirror lens", "Pencil lens"], "answer": 0, "explanation": "A concave lens spreads rays apart.", "id": "q3_2"}, {"question": "What is the lens formula given in the chapter?", "options": ["1/v - 1/u = 1/f", "1/u + 1/v = f", "u/v = f", "P = VI"], "answer": 0, "explanation": "The chapter states the lens formula as 1/v - 1/u = 1/f.", "id": "q3_3"}, {"question": "What does lens power measure?", "options": ["How strongly the lens bends light", "How heavy the lens is", "How bright the room is", "How loud the lens is"], "answer": 0, "explanation": "Power tells the converging or diverging strength of a lens.", "id": "q3_4"}, {"question": "What is the SI unit of lens power?", "options": ["Dioptre", "Newton", "Joule", "Metre per second"], "answer": 0, "explanation": "Lens power is measured in dioptres.", "id": "q3_5"}, {"question": "What sign does a convex lens have for power?", "options": ["Positive", "Negative", "Zero always", "No sign is allowed"], "answer": 0, "explanation": "A convex lens has positive power.", "id": "q3_6"}, {"question": "What sign does a concave lens have for power?", "options": ["Negative", "Positive", "Always zero", "No sign"], "answer": 0, "explanation": "A concave lens has negative power.", "id": "q3_7"}, {"question": "Why is a lens with a short focal length considered strong?", "options": ["It bends light through larger angles", "It weighs more", "It is always thicker", "It makes shadows disappear"], "answer": 0, "explanation": "Short focal length means stronger convergence or divergence.", "id": "q3_8"}]}]};
    const SLIDES = [{"m": 0, "t": "Seeing Needs Light", "c": "<p>We see objects when light reaches our eyes after bouncing off them or passing through them.</p>\n<p>The chapter begins with a simple idea: in a dark room, objects are hard to see because no useful light is reaching the eye.</p>\n<ul><li>Light helps us see objects.</li><li>Reflection happens when light bounces from a surface.</li><li>A shadow or a mirror clue can tell us how light is moving.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"page_previews/page_0001.png\" alt=\"The opening source page introduces straight-line travel of light and the first ideas about reflection.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The opening source page introduces straight-line travel of light and the first ideas about reflection.</p></div>\n<div class=\"note\"><strong>Big idea:</strong> light is the messenger that lets us see other things.</div>"}, {"m": 0, "t": "The Two Laws of Reflection", "c": "<p>The chapter states two simple rules for reflection: angle of incidence equals angle of reflection, and the incident ray, normal, and reflected ray all lie in the same plane.</p>\n<p>Those rules explain why mirror images are so regular. A surface does not guess where to send light. It follows the same pattern every time.</p>\n<ul><li>Angle of incidence = angle of reflection.</li><li>The incident ray, normal, and reflected ray stay in one plane.</li><li>Plane-mirror images are virtual, erect, and laterally inverted.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"page_previews/page_0002.png\" alt=\"The early source pages list the laws of reflection and introduce image properties in a plane mirror.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The early source pages list the laws of reflection and introduce image properties in a plane mirror.</p></div>\n<div class=\"tip\"><strong>Memory trick:</strong> the mirror is fair. It gives the same angle back that it receives.</div>"}, {"m": 0, "t": "Quiz: M0: Light Helps Us See", "q": true}, {"m": 1, "t": "Spoon Shapes and Spherical Mirrors", "c": "<p>A shiny spoon can behave a little like a curved mirror. The inward-curved side acts like a concave mirror, while the outward-curved side acts like a convex mirror.</p>\n<p>The chapter names the pole, centre of curvature, principal axis, and focus so we can talk about curved mirrors precisely.</p>\n<ul><li>Concave mirrors curve inward.</li><li>Convex mirrors curve outward.</li><li>The pole, focus, and centre of curvature help describe the mirror shape.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"page_previews/page_0003.png\" alt=\"The source pages introduce spherical mirrors and the key points used to describe them.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The source pages introduce spherical mirrors and the key points used to describe them.</p></div>\n<div class=\"real\"><strong>Kid picture:</strong> one spoon side can make things look bigger; the other can give a wider view.</div>"}, {"m": 1, "t": "What Mirror Formula and Magnification Say", "c": "<p>Concave mirrors can bring parallel rays together at a focus. Convex mirrors spread rays out as if they came from a point behind the mirror.</p>\n<p>The chapter gives the mirror formula and magnification so you can predict image position and size. For spherical mirrors, 1/v + 1/u = 1/f, and magnification is m = -v/u.</p>\n<ul><li>Concave mirrors can form real or virtual images.</li><li>Convex mirrors usually give virtual, upright, smaller images.</li><li>Magnification compares image height with object height.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"page_previews/page_0005.png\" alt=\"Later pages in the mirror section show image formation, sign convention, and the mirror formula.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">Later pages in the mirror section show image formation, sign convention, and the mirror formula.</p></div>\n<div class=\"note\"><strong>Rule of thumb:</strong> if a mirror lets you see more of the world behind you, it is usually convex.</div>"}, {"m": 1, "t": "Quiz: M1: Curved Mirrors and Images", "q": true}, {"m": 2, "t": "Why Light Bends at a Boundary", "c": "<p>Refraction happens when light moves from one transparent medium to another and changes direction.</p>\n<p>A pencil in water can look bent, and text under a glass slab can look raised because light takes a different path in the new medium.</p>\n<ul><li>Refraction means bending at a boundary.</li><li>Air to glass: bend toward the normal.</li><li>Glass to air: bend away from the normal.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"page_previews/page_0013.png\" alt=\"The refraction section starts with common examples such as a pencil in water and a raised-looking line under glass.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The refraction section starts with common examples such as a pencil in water and a raised-looking line under glass.</p></div>\n<div class=\"tip\"><strong>Easy picture:</strong> light changes lanes when the material changes.</div>"}, {"m": 2, "t": "Glass Slabs and Refractive Index", "c": "<p>A rectangular glass slab gives a neat result: the emergent ray is parallel to the incident ray, although it is shifted sideways.</p>\n<p>The chapter also introduces refractive index, which compares the speed of light in vacuum with the speed of light in a medium.</p>\n<ul><li>A glass slab produces lateral displacement.</li><li>The emergent ray stays parallel to the incident ray.</li><li>Refractive index helps compare how strongly a medium bends light.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"page_previews/page_0014.png\" alt=\"The source pages explain refraction through a glass slab and how the ray shifts sideways.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The source pages explain refraction through a glass slab and how the ray shifts sideways.</p></div>\n<div class=\"real\"><strong>Think like a detective:</strong> if a pencil looks broken in water, the pencil did not actually break.</div>"}, {"m": 2, "t": "Quiz: M2: Refraction in Glass", "q": true}, {"m": 3, "t": "How Lenses Form Images", "c": "<p>A lens is a transparent material with at least one curved surface. Convex lenses bring rays together, while concave lenses spread them apart.</p>\n<p>The chapter shows that lenses can make images that are real or virtual depending on where the object is placed.</p>\n<ul><li>Convex lenses converge light.</li><li>Concave lenses diverge light.</li><li>Lens images can be real or virtual.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"page_previews/page_0018.png\" alt=\"The lens section of the source chapter introduces image formation for convex and concave lenses.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The lens section of the source chapter introduces image formation for convex and concave lenses.</p></div>\n<div class=\"note\"><strong>Picture it:</strong> a convex lens acts like a light helper that pulls rays together.</div>"}, {"m": 3, "t": "Lens Formula and Power", "c": "<p>The chapter gives the lens formula 1/v - 1/u = 1/f and uses the same style of sign convention as mirrors, but measured from the optical centre.</p>\n<p>It also defines power as the reciprocal of focal length. Power is useful because a lens with a short focal length bends light more strongly.</p>\n<ul><li>Lens formula: 1/v - 1/u = 1/f</li><li>Power P = 1/f</li><li>Power is measured in dioptres (D).</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"page_previews/page_0025.png\" alt=\"The later pages summarize sign convention, the lens formula, and the power of a lens.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The later pages summarize sign convention, the lens formula, and the power of a lens.</p></div>\n<div class=\"tip\"><strong>Fast rule:</strong> shorter focal length means stronger lens power.</div>"}, {"m": 3, "t": "Quiz: M3: Lenses and Focus", "q": true}];

    function save() {
      const data = { cur, quizState, failedQs, ts: Date.now() };
      try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) {}
      try { document.cookie = STORE_KEY + '=' + cur + ';max-age=31536000;path=/'; } catch (e) {}
    }

    function load() {
      try {
        const data = JSON.parse(localStorage.getItem(STORE_KEY));
        if (data) {
          cur = data.cur || 0;
          quizState = data.quizState || {};
          failedQs = data.failedQs || [];
        }
      } catch (e) {}
    }

    function esc(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function hashSeed(seed) {
      let h = 2166136261;
      for (let i = 0; i < seed.length; i += 1) {
        h ^= seed.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function shuffleOpts(opts, seed) {
      const items = opts.map((text, index) => ({ text, correct: index === 0 }));
      let state = hashSeed(seed) || 1;
      for (let i = items.length - 1; i > 0; i -= 1) {
        state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
        const j = state % (i + 1);
        const tmp = items[i];
        items[i] = items[j];
        items[j] = tmp;
      }
      return items;
    }

    function getModule(moduleId) {
      return QUIZ_DATA.modules.find((module) => module.id === moduleId);
    }

    function ensureQuizState(moduleId) {
      const module = getModule(moduleId);
      if (!quizState[moduleId]) {
        quizState[moduleId] = { answers: {}, score: 0, total: module.questions.length, done: false };
      }
      return quizState[moduleId];
    }

    function renderQuiz(moduleId) {
      const module = getModule(moduleId);
      const state = ensureQuizState(moduleId);
      state.total = module.questions.length;
      state.score = Object.values(state.answers).filter((answer) => answer.correct).length;

      const nextQuestion = module.questions.find((question) => !state.answers[question.id]);
      if (!nextQuestion) {
        state.done = true;
        const pct = Math.round((state.score / state.total) * 100);
        return `
          <div class="quiz-container">
            <h1>${esc(module.name)} Quiz</h1>
            <p class="quiz-meta">You completed ${state.total} questions for this module.</p>
            <div class="${pct >= 70 ? 'quiz-feedback pass show' : 'quiz-feedback fail show'}">
              Score: ${state.score} / ${state.total} (${pct}%).
              Use Retry to revisit questions answered incorrectly.
            </div>
          </div>
        `;
      }

      const questionIndex = module.questions.findIndex((question) => question.id === nextQuestion.id);
      const options = shuffleOpts(nextQuestion.options, nextQuestion.id);

      return `
        <div class="quiz-container">
          <h1>${esc(module.name)} Quiz</h1>
          <p class="quiz-meta">Question ${questionIndex + 1} of ${module.questions.length}</p>
          <h2>${esc(nextQuestion.question)}</h2>
          ${options.map((option, index) => `
            <button class="quiz-opt" id="opt-${index}" onclick="answerQuiz(${moduleId}, '${nextQuestion.id}', ${index})">${esc(option.text)}</button>
          `).join('')}
          <div class="quiz-feedback" id="quiz-feedback"></div>
        </div>
      `;
    }

    function answerQuiz(moduleId, questionId, chosenIndex) {
      const module = getModule(moduleId);
      const state = ensureQuizState(moduleId);
      if (state.answers[questionId]) {
        return;
      }

      const question = module.questions.find((item) => item.id === questionId);
      const options = shuffleOpts(question.options, question.id);
      const chosen = options[chosenIndex];
      const isCorrect = !!chosen.correct;

      state.answers[questionId] = { chosen: chosen.text, correct: isCorrect };
      state.score = Object.values(state.answers).filter((answer) => answer.correct).length;

      if (!isCorrect && !failedQs.some((item) => item.moduleId === moduleId && item.qId === questionId)) {
        failedQs.push({ moduleId, qId: questionId });
      }
      if (Object.keys(state.answers).length === module.questions.length) {
        state.done = true;
      }

      options.forEach((option, index) => {
        const button = document.getElementById(`opt-${index}`);
        if (!button) return;
        button.classList.add('disabled');
        if (option.correct) {
          button.classList.add('correct');
        } else if (index === chosenIndex) {
          button.classList.add('wrong');
        }
      });

      const feedback = document.getElementById('quiz-feedback');
      if (feedback) {
        feedback.className = `quiz-feedback show ${isCorrect ? 'pass' : 'fail'}`;
        feedback.innerHTML = `<strong>${isCorrect ? 'Correct.' : 'Not quite.'}</strong> ${esc(question.explanation)}`;
      }

      save();
      setTimeout(render, isCorrect ? 1200 : 3000);
    }

    function retryFailed() {
      if (!failedQs.length) {
        alert('No failed quiz questions are currently tracked.');
        return;
      }

      const retryItems = failedQs.slice();
      retryItems.forEach((item) => {
        const state = ensureQuizState(item.moduleId);
        delete state.answers[item.qId];
        state.score = Object.values(state.answers).filter((answer) => answer.correct).length;
        state.done = false;
      });

      const first = retryItems[0];
      failedQs = [];
      cur = SLIDES.findIndex((slide) => slide.q && slide.m === first.moduleId);
      render();
    }

    function go(dir) {
      cur = Math.max(0, Math.min(SLIDES.length - 1, cur + dir));
      render();
    }

    function jump(index) {
      cur = index;
      render();
      toggleTOC(false);
    }

    function toggleTOC(force) {
      const toc = document.getElementById('toc');
      const overlay = document.getElementById('toc-overlay');
      const shouldOpen = typeof force === 'boolean' ? force : !toc.classList.contains('open');
      toc.classList.toggle('open', shouldOpen);
      overlay.classList.toggle('open', shouldOpen);
    }

    function buildTOC() {
      const tocBody = document.getElementById('toc-body');
      const html = MODULE_NAMES.map((moduleName, moduleIndex) => {
        const links = SLIDES.map((slide, slideIndex) => ({ slide, slideIndex }))
          .filter((entry) => entry.slide.m === moduleIndex)
          .map((entry) => `
            <button class="toc-link ${entry.slideIndex === cur ? 'current' : ''}" onclick="jump(${entry.slideIndex})">
              ${entry.slide.q ? 'Quiz' : esc(entry.slide.t)}
            </button>
          `)
          .join('');
        return `<div class="toc-module"><h3>${esc(moduleName)}</h3>${links}</div>`;
      }).join('');
      tocBody.innerHTML = html;
    }

    function render() {
      const slide = SLIDES[cur];
      const progress = Math.round(((cur + 1) / SLIDES.length) * 100);
      document.getElementById('progress-bar').style.width = progress + '%';
      document.getElementById('pct').textContent = progress + '%';
      document.getElementById('slide-counter').textContent = `${cur + 1} / ${SLIDES.length}`;
      document.getElementById('module-label').textContent = MODULE_NAMES[slide.m];
      document.getElementById('slide').innerHTML = slide.q ? renderQuiz(slide.m) : `<h1>${esc(slide.t)}</h1>${slide.c}`;
      save();
      buildTOC();
    }

    document.addEventListener('keydown', (event) => {
      const tag = (event.target && event.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') {
        return;
      }
      if (event.key === ' ' && !event.shiftKey) {
        event.preventDefault();
        go(1);
      } else if ((event.key === ' ' && event.shiftKey) || event.key === 'ArrowLeft') {
        event.preventDefault();
        go(-1);
      } else if (event.key === 'ArrowRight') {
        event.preventDefault();
        go(1);
      } else if (event.key === 'Home') {
        event.preventDefault();
        cur = 0;
        render();
      } else if (event.key === 'End') {
        event.preventDefault();
        cur = SLIDES.length - 1;
        render();
      } else if (event.key === 't' || event.key === 'T') {
        event.preventDefault();
        toggleTOC();
      } else if (event.key === 'r' || event.key === 'R') {
        event.preventDefault();
        retryFailed();
      }
    });

    load();
    render();
  </script>
</body>
</html>
