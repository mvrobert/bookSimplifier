, "id": "q0_8"}]}, {"id": 1, "name": "M1: Reactions of Metals and Non-metals", "questions": [{"question": "When a metal reacts with oxygen, what is commonly formed?", "options": ["Metal oxide", "Metal chloride only", "Sugar", "Soap"], "answer": 0, "explanation": "Metal + oxygen usually forms a metal oxide.", "id": "q1_1"}, {"question": "What gas is often produced when a metal reacts with an acid?", "options": ["Hydrogen", "Neon", "Oxygen only", "Carbon monoxide"], "answer": 0, "explanation": "Metal-acid reactions commonly release hydrogen.", "id": "q1_2"}, {"question": "Which pair of metals is stored carefully because it reacts very strongly?", "options": ["Sodium and potassium", "Gold and silver", "Copper and iron", "Lead and tin"], "answer": 0, "explanation": "Sodium and potassium are highly reactive.", "id": "q1_3"}, {"question": "Many metal oxides are", "options": ["basic", "always neutral", "always acidic", "living"], "answer": 0, "explanation": "Metal oxides often show basic character.", "id": "q1_4"}, {"question": "Many non-metal oxides are", "options": ["acidic", "always metallic", "always neutral", "always liquid"], "answer": 0, "explanation": "Non-metal oxides commonly show acidic character.", "id": "q1_5"}, {"question": "An oxide that reacts with both acids and bases is called", "options": ["amphoteric", "neutral only", "inert", "radioactive"], "answer": 0, "explanation": "Aluminium oxide and zinc oxide are common amphoteric examples.", "id": "q1_6"}, {"question": "Why do metals show different speeds of reaction?", "options": ["Because they have different reactivities", "Because they all have the same reactivity", "Because oxygen changes into metal", "Because acids disappear"], "answer": 0, "explanation": "Reactivity differences explain reaction speed.", "id": "q1_7"}, {"question": "Which metal reaction clue may show that hydrogen is being produced?", "options": ["Bubbling or fizzing", "The metal becomes invisible", "The beaker becomes magnetic", "Everything freezes instantly"], "answer": 0, "explanation": "Gas release is often seen as fizzing.", "id": "q1_8"}]}, {"id": 2, "name": "M2: Reactivity and Ionic Compounds", "questions": [{"question": "What can a more reactive metal do to a less reactive metal in a compound?", "options": ["Displace it", "Turn it into water", "Make it disappear completely", "Always freeze it"], "answer": 0, "explanation": "Displacement depends on reactivity order.", "id": "q2_1"}, {"question": "Highly reactive metals are usually found in nature as", "options": ["compounds", "free shining pieces", "gases only", "plants"], "answer": 0, "explanation": "Highly reactive metals usually combine with other substances.", "id": "q2_2"}, {"question": "Less reactive metals may sometimes be found", "options": ["in free state", "only in acids", "only in water", "inside indicators"], "answer": 0, "explanation": "Gold and similar metals can occur free in nature.", "id": "q2_3"}, {"question": "What type of compound often forms when metals react with non-metals?", "options": ["Ionic compound", "Only organic compound", "Protein", "Plastic"], "answer": 0, "explanation": "Metal-non-metal reactions often produce ionic compounds.", "id": "q2_4"}, {"question": "Ionic compounds usually have", "options": ["high melting points", "very low melting points like ice cream", "no solid form", "no charged particles"], "answer": 0, "explanation": "Strong ionic attraction gives high melting points.", "id": "q2_5"}, {"question": "When do ionic compounds conduct electricity well?", "options": ["When molten or dissolved in water", "Only as solid blocks", "Only when frozen", "Never"], "answer": 0, "explanation": "Ions need freedom to move in order to conduct.", "id": "q2_6"}, {"question": "Why do solid ionic compounds conduct poorly?", "options": ["Their ions cannot move freely", "They have no charges at all", "They become wood", "They lose all atoms"], "answer": 0, "explanation": "In the solid state the ions are fixed in place.", "id": "q2_7"}, {"question": "Which idea helps explain both metal extraction and displacement reactions?", "options": ["Reactivity", "Colour alone", "Taste alone", "Shape alone"], "answer": 0, "explanation": "Reactivity is the connecting idea.", "id": "q2_8"}]}, {"id": 3, "name": "M3: Corrosion, Alloys and Uses", "questions": [{"question": "What is rusting?", "options": ["Corrosion of iron", "Melting of copper", "Freezing of mercury", "A neutralisation reaction"], "answer": 0, "explanation": "Rusting is the corrosion of iron.", "id": "q3_1"}, {"question": "Which two things are important for rusting iron?", "options": ["Oxygen and moisture", "Sunlight and sand", "Only nitrogen", "Only carbon dioxide"], "answer": 0, "explanation": "Rusting needs both oxygen and moisture.", "id": "q3_2"}, {"question": "Which method can help protect iron from rusting?", "options": ["Painting or galvanising", "Cutting it into smaller pieces", "Adding sugar", "Heating it every hour"], "answer": 0, "explanation": "Protective coatings reduce contact with air and water.", "id": "q3_3"}, {"question": "What is an alloy?", "options": ["A mixture made to improve metal properties", "A single pure metal only", "A type of gas", "A kind of acid"], "answer": 0, "explanation": "Alloys are designed mixtures.", "id": "q3_4"}, {"question": "Why is pure gold often mixed with other metals?", "options": ["To make it harder", "To turn it into a gas", "To make it sour", "To remove shine"], "answer": 0, "explanation": "Pure gold is soft, so jewellery uses harder mixtures.", "id": "q3_5"}, {"question": "Which material is an alloy widely used for strength?", "options": ["Steel", "Oxygen", "Graphite", "Chlorophyll"], "answer": 0, "explanation": "Steel is a useful strong alloy.", "id": "q3_6"}, {"question": "Why do engineers use alloys?", "options": ["To get better properties than pure metals", "To remove all atoms", "To stop metals from existing", "To make everything acidic"], "answer": 0, "explanation": "Alloys can be stronger or more corrosion-resistant.", "id": "q3_7"}, {"question": "Corrosion is a problem because it", "options": ["damages useful metal objects", "always improves strength", "creates food", "turns metal into plants"], "answer": 0, "explanation": "Corrosion weakens and damages metal structures.", "id": "q3_8"}]}]};
    const SLIDES = [{"m": 0, "t": "Shiny, Strong and Shapeable", "c": "<p>Metals often stand out because they are lustrous, which means they have a shiny surface when freshly cleaned. Many metals can be hammered into sheets or stretched into wires, so they are useful for tools, utensils, and electrical work.</p>\n<p>Non-metals are usually different. They are often dull, brittle, and poor conductors, though science always keeps a few exceptions to make things interesting.</p>\n<ul><li>Lustre means shine.</li><li>Malleability means a metal can be hammered into sheets.</li><li>Ductility means a metal can be drawn into wires.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"page_previews/page_0001.png\" alt=\"The opening source page begins by comparing the physical properties of metals and non-metals.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The opening source page begins by comparing the physical properties of metals and non-metals.</p></div>\n<div class=\"tip\"><strong>Picture this:</strong> Wires need ductility, foil needs malleability, and bells need sonority.</div>"}, {"m": 0, "t": "Useful Clues and Surprising Exceptions", "c": "<p>Most metals conduct heat and electricity well, which is why copper and aluminium are so useful. Many are sonorous too, so they produce a ringing sound when struck.</p>\n<p>But not every metal acts exactly the same. Sodium is soft enough to cut with a knife, and mercury is liquid at room temperature. Learning science means noticing patterns without forgetting exceptions.</p>\n<ul><li>Metals are usually hard, but sodium is soft.</li><li>Mercury is a liquid metal.</li><li>Most non-metals are poor conductors, but graphite is a useful exception.</li></ul>\n<div class=\"note\"><strong>Smart habit:</strong> A good science learner says “usually” when talking about properties, because exceptions matter.</div>"}, {"m": 0, "t": "Quiz: M0: Spotting Metals", "q": true}, {"m": 1, "t": "How Metals React", "c": "<p>Metals react with oxygen to form metal oxides, and many of those oxides are basic in nature. Some metals react quickly, some slowly, and some need heating. That difference in speed helps us compare reactivity.</p>\n<p>Metals can also react with water and acids. Very reactive metals like sodium and potassium react so strongly that they are stored carefully to stop unwanted contact with air or moisture.</p>\n<ul><li>More reactive metals react faster.</li><li>Metal + acid can give salt + hydrogen gas.</li><li>Sodium and potassium need very careful handling.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"page_previews/page_0006.png\" alt=\"The middle pages focus on how different metals react with oxygen, water, and acids.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The middle pages focus on how different metals react with oxygen, water, and acids.</p></div>\n<div class=\"warn\"><strong>Safety note:</strong> Highly reactive metals are never classroom toys. They must be handled with strict care.</div>"}, {"m": 1, "t": "Why Non-metals Behave Differently", "c": "<p>Non-metals often form acidic oxides when they react with oxygen. They usually do not react with acids in the same dramatic way that many metals do. That makes them easy to compare with metals in reaction tables.</p>\n<p>Some metal oxides, such as those of aluminium and zinc, can react with both acids and bases. These are called amphoteric oxides, a useful word that shows chemistry likes categories with edge cases.</p>\n<ul><li>Metal oxides are often basic.</li><li>Many non-metal oxides are acidic.</li><li>Amphoteric oxides can react with both acids and bases.</li></ul>\n<div class=\"real\"><strong>Thinking like a scientist:</strong> Instead of memorising one example, ask what pattern the example belongs to.</div>"}, {"m": 1, "t": "Quiz: M1: Reactions of Metals and Non-metals", "q": true}, {"m": 2, "t": "Why Reactivity Order Matters", "c": "<p>Some metals are very reactive, some are moderately reactive, and some are much less reactive. This order matters because a more reactive metal can often displace a less reactive metal from its compound.</p>\n<p>The same idea helps in extraction. Very reactive metals are harder to obtain from their ores, while less reactive metals can sometimes be found in a free state in nature.</p>\n<ul><li>A more reactive metal can replace a less reactive one.</li><li>Highly reactive metals are usually found as compounds.</li><li>Less reactive metals may be found free in nature.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"page_previews/page_0014.png\" alt=\"Later pages connect reactivity with extraction and natural occurrence of metals.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">Later pages connect reactivity with extraction and natural occurrence of metals.</p></div>\n<div class=\"note\"><strong>Useful clue:</strong> Reactivity helps explain both lab reactions and mining processes.</div>"}, {"m": 2, "t": "What Makes Ionic Compounds Special", "c": "<p>When metals react with non-metals, electrons can be transferred and ionic compounds can form. These compounds are often hard, have high melting points, and conduct electricity when molten or dissolved in water.</p>\n<p>That combination of properties makes ionic compounds very different from many covalent substances you meet later in carbon chemistry.</p>\n<ul><li>Ionic compounds are often hard solids.</li><li>They usually have high melting and boiling points.</li><li>They conduct electricity in molten state or in solution.</li></ul>\n<div class=\"tip\"><strong>Memory hook:</strong> solid ionic compounds hold ions tightly, but melted or dissolved ionic compounds let ions move around.</div>"}, {"m": 2, "t": "Quiz: M2: Reactivity and Ionic Compounds", "q": true}, {"m": 3, "t": "Why Rusting Is a Big Deal", "c": "<p>Metals are useful, but they can slowly get damaged. Iron rusts when it reacts with oxygen and moisture. This is a kind of corrosion, and it costs money, time, and effort because bridges, tools, and machines need protection.</p>\n<p>Science fights back with methods like painting, oiling, greasing, galvanising, and alloying. Each method tries to stop oxygen, water, or unwanted reactions from attacking the metal surface.</p>\n<ul><li>Corrosion damages metal objects.</li><li>Rusting is corrosion of iron.</li><li>Protective coatings slow down corrosion.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"page_previews/page_0018.png\" alt=\"The closing source pages connect metal science with alloys, corrosion, and daily use.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The closing source pages connect metal science with alloys, corrosion, and daily use.</p></div>\n<div class=\"real\"><strong>Everyday engineering:</strong> bicycles, gates, and water tanks last longer when metal surfaces are protected.</div>"}, {"m": 3, "t": "Why We Make Alloys", "c": "<p>Pure metals are not always the best choice. Gold is soft, iron can rust, and some metals need extra strength. An alloy is a mixture of metals, or a metal with a small amount of another element, made to improve useful properties.</p>\n<p>Brass, bronze, and steel are famous examples. Alloys can be harder, stronger, or more resistant to corrosion than the pure metals they come from.</p>\n<ul><li>An alloy is made to improve properties.</li><li>Steel is stronger than pure iron for many jobs.</li><li>Jewellery gold is often mixed with other metals for hardness.</li></ul>\n<div class=\"tip\"><strong>Design thinking:</strong> Scientists and engineers do not just ask “What is this metal?” They also ask “What job must this metal do?”</div>"}, {"m": 3, "t": "Quiz: M3: Corrosion, Alloys and Uses", "q": true}];

    function hashSeed(seed) {

      for (let i = 0; i < seed.length; i += 1) {

        h = Math.imul(h, 16777619);

    function shuffleOpts(opts, seed) {

      let state = hashSeed(seed) || 1;
      for (let i = items.length - 1; i > 0; i -= 1) {
        state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
        const j = state % (i + 1);

        items[i] = items[j];

    }

    function ensureQuizState(moduleId) {
      const module = getModule(moduleId);
      if (!quizState[moduleId]) {
        quizState[moduleId] = { answers: {}, score: 0, total: module.questions.length, done: false };
      }
      return quizState[moduleId];
    }

    function renderQuiz(moduleId) {
      const module = getModule(moduleId);
      const state = ensureQuizState(moduleId);
      state.total = module.questions.length;
      state.score = Object.values(state.answers).filter((answer) => answer.correct).length;

      const nextQuestion = module.questions.find((question) => !state.answers[question.id]);
      if (!nextQuestion) {
        state.done = true;
        const pct = Math.round((state.score / state.total) * 100);
        return `
          <div class="quiz-container">
            <h1>${esc(module.name)} Quiz</h1>
            <p class="quiz-meta">You completed ${state.total} questions for this module.</p>
            <div class="${pct >= 70 ? 'quiz-feedback pass show' : 'quiz-feedback fail show'}">
              Score: ${state.score} / ${state.total} (${pct}%).
              Use Retry to revisit questions answered incorrectly.
            </div>
          </div>
        `;
      }

      const questionIndex = module.questions.findIndex((question) => question.id === nextQuestion.id);
      const options = shuffleOpts(nextQuestion.options, nextQuestion.id);

      return `
        <div class="quiz-container">
          <h1>${esc(module.name)} Quiz</h1>
          <p class="quiz-meta">Question ${questionIndex + 1} of ${module.questions.length}</p>
          <h2>${esc(nextQuestion.question)}</h2>
          ${options.map((option, index) => `
            <button class="quiz-opt" id="opt-${index}" onclick="answerQuiz(${moduleId}, '${nextQuestion.id}', ${index})">${esc(option.text)}</button>
          `).join('')}
          <div class="quiz-feedback" id="quiz-feedback"></div>
        </div>
      `;
    }

    function answerQuiz(moduleId, questionId, chosenIndex) {
      const module = getModule(moduleId);
      const state = ensureQuizState(moduleId);
      if (state.answers[questionId]) {
        return;
      }

      const question = module.questions.find((item) => item.id === questionId);
      const options = shuffleOpts(question.options, question.id);
      const chosen = options[chosenIndex];
      const isCorrect = !!chosen.correct;

      state.answers[questionId] = { chosen: chosen.text, correct: isCorrect };
      state.score = Object.values(state.answers).filter((answer) => answer.correct).length;

      if (!isCorrect && !failedQs.some((item) => item.moduleId === moduleId && item.qId === questionId)) {
        failedQs.push({ moduleId, qId: questionId });
      }
      if (Object.keys(state.answers).length === module.questions.length) {
        state.done = true;
      }

      options.forEach((option, index) => {
        const button = document.getElementById(`opt-${index}`);
        if (!button) return;
        button.classList.add('disabled');
        if (option.correct) {
          button.classList.add('correct');
        } else if (index === chosenIndex) {
          button.classList.add('wrong');
        }
      });

      const feedback = document.getElementById('quiz-feedback');
      if (feedback) {
        feedback.className = `quiz-feedback show ${isCorrect ? 'pass' : 'fail'}`;
        feedback.innerHTML = `<strong>${isCorrect ? 'Correct.' : 'Not quite.'}</strong> ${esc(question.explanation)}`;
      }

      save();
      setTimeout(render, isCorrect ? 1200 : 3000);
    }

    function retryFailed() {
      if (!failedQs.length) {
        alert('No failed quiz questions are currently tracked.');
        return;
      }

      const retryItems = failedQs.slice();
      retryItems.forEach((item) => {
        const state = ensureQuizState(item.moduleId);
        delete state.answers[item.qId];
        state.score = Object.values(state.answers).filter((answer) => answer.correct).length;
        state.done = false;
      });

      const first = retryItems[0];
      failedQs = [];
      cur = SLIDES.findIndex((slide) => slide.q && slide.m === first.moduleId);
      render();
    }

    function go(dir) {
      cur = Math.max(0, Math.min(SLIDES.length - 1, cur + dir));
      render();
    }

    function jump(index) {
      cur = index;
      render();
      toggleTOC(false);
    }

    function toggleTOC(force) {
      const toc = document.getElementById('toc');
      const overlay = document.getElementById('toc-overlay');
      const shouldOpen = typeof force === 'boolean' ? force : !toc.classList.contains('open');
      toc.classList.toggle('open', shouldOpen);
      overlay.classList.toggle('open', shouldOpen);
    }

    function buildTOC() {
      const tocBody = document.getElementById('toc-body');
      const html = MODULE_NAMES.map((moduleName, moduleIndex) => {
        const links = SLIDES.map((slide, slideIndex) => ({ slide, slideIndex }))
          .filter((entry) => entry.slide.m === moduleIndex)
          .map((entry) => `
            <button class="toc-link ${entry.slideIndex === cur ? 'current' : ''}" onclick="jump(${entry.slideIndex})">
              ${entry.slide.q ? 'Quiz' : esc(entry.slide.t)}
            </button>
          `)
          .join('');
        return `<div class="toc-module"><h3>${esc(moduleName)}</h3>${links}</div>`;
      }).join('');
      tocBody.innerHTML = html;
    }

    function render() {
      const slide = SLIDES[cur];
      const progress = Math.round(((cur + 1) / SLIDES.length) * 100);
      document.getElementById('progress-bar').style.width = progress + '%';
      document.getElementById('pct').textContent = progress + '%';
      document.getElementById('slide-counter').textContent = `${cur + 1} / ${SLIDES.length}`;
      document.getElementById('module-label').textContent = MODULE_NAMES[slide.m];
      document.getElementById('slide').innerHTML = slide.q ? renderQuiz(slide.m) : `<h1>${esc(slide.t)}</h1>${slide.c}`;
      save();
      buildTOC();
    }

    document.addEventListener('keydown', (event) => {
      const tag = (event.target && event.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') {
        return;
      }
      if (event.key === ' ' && !event.shiftKey) {
        event.preventDefault();
        go(1);
      } else if ((event.key === ' ' && event.shiftKey) || event.key === 'ArrowLeft') {
        event.preventDefault();
        go(-1);
      } else if (event.key === 'ArrowRight') {
        event.preventDefault();
        go(1);
      } else if (event.key === 'Home') {
        event.preventDefault();
        cur = 0;
        render();
      } else if (event.key === 'End') {
        event.preventDefault();
        cur = SLIDES.length - 1;
        render();
      } else if (event.key === 't' || event.key === 'T') {
        event.preventDefault();
        toggleTOC();
      } else if (event.key === 'r' || event.key === 'R') {
        event.preventDefault();
        retryFailed();
      }
    });

    load();
    render();
  </script>
</body>
</html>
