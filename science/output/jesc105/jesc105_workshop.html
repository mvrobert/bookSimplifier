  <style>

    const QUIZ_DATA = {"title": "Life Processes - Kid-friendly science workshop with tiny lessons and quick quizzes", "version": "1.0", "totalQuestions": 32, "modules": [{"id": 0, "name": "M0: What Keeps Living Things Alive", "questions": [{"question": "Why are life processes important?", "options": ["They maintain the body and keep it alive", "They only help in sleeping", "They are needed only for machines", "They remove all molecules"], "answer": 0, "explanation": "Life processes are the maintenance jobs of living organisms.", "id": "q0_1"}, {"question": "Why is visible movement not enough to define life?", "options": ["Because many important life activities are hidden inside the body", "Because all living things are always still", "Because plants are metals", "Because movement does not exist"], "answer": 0, "explanation": "Internal molecular and cellular activity matters.", "id": "q0_2"}, {"question": "Which organisms make their own food?", "options": ["Autotrophs", "Heterotrophs", "Only animals", "Only fungi in this lesson"], "answer": 0, "explanation": "Autotrophs prepare their own food.", "id": "q0_3"}, {"question": "Green plants make food mainly by", "options": ["photosynthesis", "rusting", "neutralisation", "distillation"], "answer": 0, "explanation": "Photosynthesis is the food-making process in plants.", "id": "q0_4"}, {"question": "Which organisms depend on ready-made food?", "options": ["Heterotrophs", "Autotrophs", "Only stones", "Only gases"], "answer": 0, "explanation": "Heterotrophs depend on other organisms for food.", "id": "q0_5"}, {"question": "What does food supply for the body?", "options": ["Energy, growth, and repair materials", "Only colour", "Only sound", "Only magnets"], "answer": 0, "explanation": "Food supports multiple life needs.", "id": "q0_6"}, {"question": "A sleeping person is still alive because", "options": ["life processes continue inside the body", "all cells stop working", "oxygen is no longer needed", "the heart becomes metal"], "answer": 0, "explanation": "Hidden maintenance processes keep running.", "id": "q0_7"}, {"question": "What does the word autotroph suggest?", "options": ["Self-feeding or self-nourishing", "Always moving fast", "Made of metal", "Having no cells"], "answer": 0, "explanation": "“Auto” helps remember self-made food.", "id": "q0_8"}]}, {"id": 1, "name": "M1: Respiration and Breathing", "questions": [{"question": "What is respiration mainly about?", "options": ["Releasing energy from food", "Only drinking water", "Only movement of legs", "Only sleeping"], "answer": 0, "explanation": "Respiration makes food energy usable.", "id": "q1_1"}, {"question": "What is breathing?", "options": ["Movement of air in and out of the body", "Breaking down food inside cells", "A kind of alloy", "A neutralisation reaction"], "answer": 0, "explanation": "Breathing is physical movement of air.", "id": "q1_2"}, {"question": "Which process directly releases usable energy inside cells?", "options": ["Respiration", "Breathing only", "Rusting", "Melting"], "answer": 0, "explanation": "Respiration is the energy-releasing process.", "id": "q1_3"}, {"question": "Aerobic respiration needs", "options": ["oxygen", "only salt", "graphite", "kerosene"], "answer": 0, "explanation": "Aerobic respiration uses oxygen.", "id": "q1_4"}, {"question": "Anaerobic respiration happens when", "options": ["oxygen is absent or insufficient", "oxygen is very abundant", "water is solid", "all cells stop"], "answer": 0, "explanation": "Anaerobic pathways work without enough oxygen.", "id": "q1_5"}, {"question": "Why can intense exercise make muscles feel strained?", "options": ["Oxygen supply may not keep up fully with demand", "Because muscles become wooden", "Because breathing stops forever", "Because all food disappears"], "answer": 0, "explanation": "Hard-working muscles can face oxygen shortage.", "id": "q1_6"}, {"question": "Which statement is correct?", "options": ["Breathing and respiration are related but not identical", "They are exactly the same word", "Breathing happens only in plants", "Respiration happens only outside the body"], "answer": 0, "explanation": "One is movement of air, the other is cellular energy release.", "id": "q1_7"}, {"question": "Why does the body need respiration?", "options": ["To make stored food energy usable", "To turn bones into gas", "To create litmus paper", "To stop the heart"], "answer": 0, "explanation": "Respiration keeps energy available for life processes.", "id": "q1_8"}]}, {"id": 2, "name": "M2: Transport in Bodies and Plants", "questions": [{"question": "Why does the body need a transport system?", "options": ["To move materials to and from cells", "To change metals into plants", "To stop respiration", "To remove all water"], "answer": 0, "explanation": "Cells need a delivery system.", "id": "q2_1"}, {"question": "Which organ pumps blood through the body?", "options": ["Heart", "Liver", "Kidney", "Stomach"], "answer": 0, "explanation": "The heart is the main pump.", "id": "q2_2"}, {"question": "What does blood carry?", "options": ["Oxygen, nutrients, and wastes", "Only bones", "Only sound", "Only acids"], "answer": 0, "explanation": "Blood transports many important materials.", "id": "q2_3"}, {"question": "Which plant tissue mainly carries water and minerals?", "options": ["Xylem", "Phloem", "Epidermis", "Petal"], "answer": 0, "explanation": "Xylem is the water-carrying tissue.", "id": "q2_4"}, {"question": "Which plant tissue carries prepared food?", "options": ["Phloem", "Xylem", "Bark only", "Root cap only"], "answer": 0, "explanation": "Phloem transports food.", "id": "q2_5"}, {"question": "Why is transport important even in plants?", "options": ["Because different parts need water, minerals, and food", "Because plants do not have cells", "Because roots can fly", "Because leaves are metals"], "answer": 0, "explanation": "Plants also need internal distribution.", "id": "q2_6"}, {"question": "Which statement is true?", "options": ["Transport helps with both supply and waste removal", "Transport only brings colour", "Transport happens only during sleep", "Transport is not needed in multicellular organisms"], "answer": 0, "explanation": "Delivery and cleanup are both transport roles.", "id": "q2_7"}, {"question": "What does the heart mainly act like?", "options": ["A pump", "A magnet", "A pH paper", "A beaker"], "answer": 0, "explanation": "The heart drives circulation by pumping blood.", "id": "q2_8"}]}, {"id": 3, "name": "M3: Excretion and Balance", "questions": [{"question": "Why is excretion important?", "options": ["It removes harmful wastes from the body", "It creates all food", "It turns blood into bones", "It stops all movement"], "answer": 0, "explanation": "Excretion protects the body by removing wastes.", "id": "q3_1"}, {"question": "Which organs mainly filter blood to form urine?", "options": ["Kidneys", "Lungs", "Eyes", "Skin only"], "answer": 0, "explanation": "Kidneys are the main excretory organs.", "id": "q3_2"}, {"question": "What is a nephron?", "options": ["A tiny filtering unit in the kidney", "A type of blood vessel", "A food molecule", "A metal alloy"], "answer": 0, "explanation": "Nephrons do the filtering work.", "id": "q3_3"}, {"question": "What can happen if harmful wastes are not removed?", "options": ["They can damage the body", "They become food", "They increase photosynthesis", "They become magnets"], "answer": 0, "explanation": "Waste buildup is harmful.", "id": "q3_4"}, {"question": "Which plant structures help in gas exchange and water loss?", "options": ["Stomata", "Nephrons", "Ribosomes", "Bones"], "answer": 0, "explanation": "Stomata are important openings in leaves.", "id": "q3_5"}, {"question": "Which statement fits life processes best?", "options": ["They work together to maintain balance", "They are all unrelated", "Only nutrition matters", "Only excretion matters"], "answer": 0, "explanation": "Life processes are connected systems.", "id": "q3_6"}, {"question": "What is one major job of the urinary system?", "options": ["Removing dissolved wastes", "Making chlorophyll", "Producing metal sheets", "Raising pH paper"], "answer": 0, "explanation": "Urine formation helps remove wastes.", "id": "q3_7"}, {"question": "Why are nephrons important even though they are tiny?", "options": ["Small structures can perform essential body functions", "Tiny things are never useful", "They replace the heart", "They only store oxygen"], "answer": 0, "explanation": "Nephrons show how microscopic units do vital work.", "id": "q3_8"}]}]};
    const SLIDES = [{"m": 0, "t": "Life Means Constant Work", "c": "<p>Living things are not alive only when they run, jump, or wave. Even when you are resting, your body is still busy. Cells keep repairing, moving materials, making energy available, and maintaining order inside the body.</p>\n<p>That is why life processes matter. They are the quiet jobs that keep organisms alive all the time, even when no obvious movement can be seen.</p>\n<ul><li>Life needs continuous maintenance.</li><li>Molecular movement inside the body matters.</li><li>Visible movement alone is not enough to define life.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"page_previews/page_0001.png\" alt=\"The opening source page explains that life depends on invisible maintenance processes, not only visible movement.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The opening source page explains that life depends on invisible maintenance processes, not only visible movement.</p></div>\n<div class=\"tip\"><strong>Think deeper:</strong> A sleeping dog is alive because many hidden processes are still happening.</div>"}, {"m": 0, "t": "Nutrition Starts the Story", "c": "<p>Organisms need materials to grow, repair, and release energy. Green plants make food through photosynthesis, while animals and humans depend on eating other organisms or their products.</p>\n<p>Nutrition is therefore the first big survival system. Without food or a way to make food, the rest of the body's processes cannot keep going for long.</p>\n<ul><li>Plants are autotrophs because they make food.</li><li>Animals are heterotrophs because they depend on ready-made food.</li><li>Food supports growth, repair, and energy release.</li></ul>\n<div class=\"note\"><strong>Word power:</strong> “auto” means self, so an autotroph makes its own food.</div>"}, {"m": 0, "t": "Quiz: M0: What Keeps Living Things Alive", "q": true}, {"m": 1, "t": "Why Food Alone Is Not Enough", "c": "<p>Food stores energy, but that energy must be released in a usable way. Respiration breaks down food to release energy that cells can use. This happens inside the body all the time.</p>\n<p>Breathing and respiration are connected, but they are not exactly the same thing. Breathing moves air in and out, while respiration is the chemical process that releases energy from food.</p>\n<ul><li>Breathing is movement of air.</li><li>Respiration releases energy from food.</li><li>Oxygen helps complete aerobic respiration.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"page_previews/page_0010.png\" alt=\"Middle source pages explain how respiration releases energy from food and how gas exchange supports it.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">Middle source pages explain how respiration releases energy from food and how gas exchange supports it.</p></div>\n<div class=\"tip\"><strong>Easy distinction:</strong> Breathing is the door. Respiration is what happens inside the room.</div>"}, {"m": 1, "t": "Different Paths of Respiration", "c": "<p>When oxygen is available, cells can release more energy through aerobic respiration. When oxygen is limited, some organisms or body cells may use anaerobic pathways instead. That can lead to different end products.</p>\n<p>This matters in real life. Muscles working very hard may not get oxygen fast enough for every cell all the time, which is one reason the body can feel tired or strained.</p>\n<ul><li>Aerobic respiration uses oxygen.</li><li>Anaerobic respiration happens without enough oxygen.</li><li>Energy release and end products can differ.</li></ul>\n<div class=\"real\"><strong>Sports link:</strong> Heavy exercise reminds you that respiration is not just a textbook idea.</div>"}, {"m": 1, "t": "Quiz: M1: Respiration and Breathing", "q": true}, {"m": 2, "t": "The Body Needs Delivery Systems", "c": "<p>Cells are spread throughout the body, so oxygen, food, water, and wastes cannot stay in one place. Transport systems move these materials where they need to go. In humans, blood and the heart play the central role.</p>\n<p>The heart works like a powerful pump. Blood carries oxygen, nutrients, hormones, and wastes through vessels so cells can keep functioning.</p>\n<ul><li>The heart pumps blood.</li><li>Blood carries oxygen and nutrients.</li><li>Transport also helps remove wastes.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"page_previews/page_0014.png\" alt=\"The transport pages focus on the heart, blood flow, and movement of materials inside the body.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The transport pages focus on the heart, blood flow, and movement of materials inside the body.</p></div>\n<div class=\"note\"><strong>Big picture:</strong> A transport system is a delivery and cleanup network at the same time.</div>"}, {"m": 2, "t": "Plants Also Need Transport", "c": "<p>Plants may not have a heart, but they still need transport. Water and minerals move upward from the roots through xylem, while prepared food can move through phloem to places that need it.</p>\n<p>This shows one of the most beautiful ideas in biology: different organisms solve the same problem in different ways.</p>\n<ul><li>Xylem mainly carries water and minerals.</li><li>Phloem carries prepared food.</li><li>Transport is essential in both plants and animals.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"page_previews/page_0018.png\" alt=\"Later source pages describe xylem and phloem as transport tissues in plants.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">Later source pages describe xylem and phloem as transport tissues in plants.</p></div>\n<div class=\"tip\"><strong>Memory trick:</strong> Xylem lifts water up. Phloem shares food around.</div>"}, {"m": 2, "t": "Quiz: M2: Transport in Bodies and Plants", "q": true}, {"m": 3, "t": "Cleaning Up the Body", "c": "<p>Life processes create wastes as well as useful products. If those wastes stay inside too long, they can harm the body. Excretion removes these unwanted materials and helps keep internal conditions balanced.</p>\n<p>In humans, kidneys filter the blood and form urine. Tiny units called nephrons do the filtering work, proving again that big body jobs depend on tiny structures.</p>\n<ul><li>Excretion removes harmful wastes.</li><li>Kidneys filter the blood.</li><li>Nephrons are the tiny filtering units.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"page_previews/page_0020.png\" alt=\"The final pages cover excretion and how the body filters wastes.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The final pages cover excretion and how the body filters wastes.</p></div>\n<div class=\"real\"><strong>Body wisdom:</strong> Survival is not only about taking things in. It is also about removing the right things.</div>"}, {"m": 3, "t": "Balance Matters in Plants Too", "c": "<p>Plants also handle extra materials and water balance in their own ways. Stomata help in gas exchange and water loss, while transport tissues and surrounding cells help manage movement and pressure inside the plant.</p>\n<p>Across humans and plants, one shared truth appears again and again: life survives by maintaining balance through many connected processes.</p>\n<ul><li>Excretion and balance support life.</li><li>Plants also regulate water and gases.</li><li>Life processes work as a team, not as separate islands.</li></ul>\n<div class=\"tip\"><strong>Final thought:</strong> Nutrition, respiration, transport, and excretion are like teammates keeping the organism stable.</div>"}, {"m": 3, "t": "Quiz: M3: Excretion and Balance", "q": true}];
    const MODULE_NAMES = ["M0: What Keeps Living Things Alive", "M1: Respiration and Breathing", "M2: Transport in Bodies and Plants", "M3: Excretion and Balance"];

    function esc(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function hashSeed(seed) {
      let h = 2166136261;
      for (let i = 0; i < seed.length; i += 1) {
        h ^= seed.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function shuffleOpts(opts, seed) {
      const items = opts.map((text, index) => ({ text, correct: index === 0 }));
      let state = hashSeed(seed) || 1;
      for (let i = items.length - 1; i > 0; i -= 1) {
        state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
        const j = state % (i + 1);
        const tmp = items[i];
        items[i] = items[j];
        items[j] = tmp;
      }
      return items;
    }

    function getModule(moduleId) {
      return QUIZ_DATA.modules.find((module) => module.id === moduleId);
    }

    function ensureQuizState(moduleId) {
      const module = getModule(moduleId);
      if (!quizState[moduleId]) {
        quizState[moduleId] = { answers: {}, score: 0, total: module.questions.length, done: false };
      }
      return quizState[moduleId];
    }

    function renderQuiz(moduleId) {
      const module = getModule(moduleId);
      const state = ensureQuizState(moduleId);
      state.total = module.questions.length;
      state.score = Object.values(state.answers).filter((answer) => answer.correct).length;

      const nextQuestion = module.questions.find((question) => !state.answers[question.id]);
      if (!nextQuestion) {
        state.done = true;
        const pct = Math.round((state.score / state.total) * 100);
        return `
          <div class="quiz-container">
            <h1>${esc(module.name)} Quiz</h1>
            <p class="quiz-meta">You completed ${state.total} questions for this module.</p>
            <div class="${pct >= 70 ? 'quiz-feedback pass show' : 'quiz-feedback fail show'}">
              Score: ${state.score} / ${state.total} (${pct}%).
              Use Retry to revisit questions answered incorrectly.
            </div>
          </div>
        `;
      }

      const questionIndex = module.questions.findIndex((question) => question.id === nextQuestion.id);
      const options = shuffleOpts(nextQuestion.options, nextQuestion.id);

      return `
        <div class="quiz-container">
          <h1>${esc(module.name)} Quiz</h1>
          <p class="quiz-meta">Question ${questionIndex + 1} of ${module.questions.length}</p>
          <h2>${esc(nextQuestion.question)}</h2>
          ${options.map((option, index) => `
            <button class="quiz-opt" id="opt-${index}" onclick="answerQuiz(${moduleId}, '${nextQuestion.id}', ${index})">${esc(option.text)}</button>
          `).join('')}
          <div class="quiz-feedback" id="quiz-feedback"></div>
        </div>
      `;
    }

    function answerQuiz(moduleId, questionId, chosenIndex) {
      const module = getModule(moduleId);
      const state = ensureQuizState(moduleId);
      if (state.answers[questionId]) {
        return;
      }

      const question = module.questions.find((item) => item.id === questionId);
      const options = shuffleOpts(question.options, question.id);
      const chosen = options[chosenIndex];
      const isCorrect = !!chosen.correct;

      state.answers[questionId] = { chosen: chosen.text, correct: isCorrect };
      state.score = Object.values(state.answers).filter((answer) => answer.correct).length;

      if (!isCorrect && !failedQs.some((item) => item.moduleId === moduleId && item.qId === questionId)) {
        failedQs.push({ moduleId, qId: questionId });
      }
      if (Object.keys(state.answers).length === module.questions.length) {
        state.done = true;
      }

      options.forEach((option, index) => {
        const button = document.getElementById(`opt-${index}`);
        if (!button) return;
        button.classList.add('disabled');
        if (option.correct) {
          button.classList.add('correct');
        } else if (index === chosenIndex) {
          button.classList.add('wrong');
        }
      });

      const feedback = document.getElementById('quiz-feedback');
      if (feedback) {
        feedback.className = `quiz-feedback show ${isCorrect ? 'pass' : 'fail'}`;
        feedback.innerHTML = `<strong>${isCorrect ? 'Correct.' : 'Not quite.'}</strong> ${esc(question.explanation)}`;
      }

      save();
      setTimeout(render, isCorrect ? 1200 : 3000);
    }

    function retryFailed() {
      if (!failedQs.length) {
        alert('No failed quiz questions are currently tracked.');
        return;
      }

      const retryItems = failedQs.slice();
      retryItems.forEach((item) => {
        const state = ensureQuizState(item.moduleId);
        delete state.answers[item.qId];
        state.score = Object.values(state.answers).filter((answer) => answer.correct).length;
        state.done = false;
      });

      const first = retryItems[0];
      failedQs = [];
      cur = SLIDES.findIndex((slide) => slide.q && slide.m === first.moduleId);
      render();
    }

    function go(dir) {
      cur = Math.max(0, Math.min(SLIDES.length - 1, cur + dir));
      render();
    }

    function jump(index) {
      cur = index;
      render();
      toggleTOC(false);
    }

    function toggleTOC(force) {
      const toc = document.getElementById('toc');
      const overlay = document.getElementById('toc-overlay');
      const shouldOpen = typeof force === 'boolean' ? force : !toc.classList.contains('open');
      toc.classList.toggle('open', shouldOpen);
      overlay.classList.toggle('open', shouldOpen);
    }

    function buildTOC() {
      const tocBody = document.getElementById('toc-body');
      const html = MODULE_NAMES.map((moduleName, moduleIndex) => {
        const links = SLIDES.map((slide, slideIndex) => ({ slide, slideIndex }))
          .filter((entry) => entry.slide.m === moduleIndex)
          .map((entry) => `
            <button class="toc-link ${entry.slideIndex === cur ? 'current' : ''}" onclick="jump(${entry.slideIndex})">
              ${entry.slide.q ? 'Quiz' : esc(entry.slide.t)}
            </button>
          `)
          .join('');
        return `<div class="toc-module"><h3>${esc(moduleName)}</h3>${links}</div>`;
      }).join('');
      tocBody.innerHTML = html;
    }

    function render() {
      const slide = SLIDES[cur];
      const progress = Math.round(((cur + 1) / SLIDES.length) * 100);
      document.getElementById('progress-bar').style.width = progress + '%';
      document.getElementById('pct').textContent = progress + '%';
      document.getElementById('slide-counter').textContent = `${cur + 1} / ${SLIDES.length}`;
      document.getElementById('module-label').textContent = MODULE_NAMES[slide.m];
      document.getElementById('slide').innerHTML = slide.q ? renderQuiz(slide.m) : `<h1>${esc(slide.t)}</h1>${slide.c}`;
      save();
      buildTOC();
    }

    document.addEventListener('keydown', (event) => {
      const tag = (event.target && event.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') {
        return;
      }
      if (event.key === ' ' && !event.shiftKey) {
        event.preventDefault();
        go(1);
      } else if ((event.key === ' ' && event.shiftKey) || event.key === 'ArrowLeft') {
        event.preventDefault();
        go(-1);
      } else if (event.key === 'ArrowRight') {
        event.preventDefault();
        go(1);
      } else if (event.key === 'Home') {
        event.preventDefault();
        cur = 0;
        render();
      } else if (event.key === 'End') {
        event.preventDefault();
        cur = SLIDES.length - 1;
        render();
      } else if (event.key === 't' || event.key === 'T') {
        event.preventDefault();
        toggleTOC();
      } else if (event.key === 'r' || event.key === 'R') {
        event.preventDefault();
        retryFailed();
      }
    });

    load();
    render();
  </script>
</body>
</html>
