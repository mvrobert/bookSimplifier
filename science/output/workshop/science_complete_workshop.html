rmers check soil conditions because crops do better within a suitable pH range. Even our digestive system depends on acids and bases being controlled carefully.</p>\n<p>That makes pH more than a lab topic. It is a tool for health, farming, cleaning, and environmental care.</p>\n<ul><li>Very acidic food leftovers can affect teeth.</li><li>Soil pH can influence plant growth.</li><li>Digestive comfort can depend on acid-base balance.</li></ul>\n<div class=\"tip\"><strong>Kid memory trick:</strong> Think of 7 as the middle seat. Acid sits on one side, base sits on the other.</div>"}, {"m": 3, "t": "Quiz: Acids, Bases and Salts - M2: The pH Scale", "q": true}, {"m": 4, "t": "Common Salt Does More Than Season Food", "c": "<p>Common salt is not just something sprinkled on food. It is an important raw material for making many useful substances. From one familiar starting material, chemists can prepare sodium hydroxide, baking soda, bleaching powder, and more.</p>\n<p>This is a powerful science lesson: ordinary-looking substances can become the starting point for many useful products when we understand reactions properly.</p>\n<ul><li>Common salt is a useful chemical raw material.</li><li>It helps in making several products used at home and in industry.</li><li>Salts can have very different uses from the substances that formed them.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc102/page_previews/page_0014.png\" alt=\"The source pages connect common salt with several useful products of daily life.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The source pages connect common salt with several useful products of daily life.</p></div>\n<div class=\"real\"><strong>Look around:</strong> baking soda in kitchens, bleaching powder in sanitation, and plaster materials in classrooms all connect with salt chemistry.</div>"}, {"m": 4, "t": "Baking Soda, Washing Soda and POP", "c": "<p>Baking soda helps in baking and is also used in some antacids. Washing soda is useful for cleaning and softening hard water. Plaster of Paris, often called POP, is valuable for casts, moulds, and decorative shapes because it sets into a hard solid after mixing.</p>\n<p>These examples show why science is exciting for kids: the chemistry in your classroom, kitchen, and health kit is full of hidden stories.</p>\n<ul><li>Baking soda can release carbon dioxide while heating or reacting.</li><li>Washing soda helps in cleaning work.</li><li>Plaster of Paris is made from gypsum and sets after mixing.</li></ul>\n<div class=\"tip\"><strong>Mini challenge:</strong> Next time you see a chalky white powder, ask yourself whether it is food-related, cleaning-related, or building-related chemistry.</div>"}, {"m": 4, "t": "Quiz: Acids, Bases and Salts - M3: Helpful Salts in Daily Life", "q": true}, {"m": 5, "t": "Shiny, Strong and Shapeable", "c": "<p>Metals often stand out because they are lustrous, which means they have a shiny surface when freshly cleaned. Many metals can be hammered into sheets or stretched into wires, so they are useful for tools, utensils, and electrical work.</p>\n<p>Non-metals are usually different. They are often dull, brittle, and poor conductors, though science always keeps a few exceptions to make things interesting.</p>\n<ul><li>Lustre means shine.</li><li>Malleability means a metal can be hammered into sheets.</li><li>Ductility means a metal can be drawn into wires.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc103/page_previews/page_0001.png\" alt=\"The opening source page begins by comparing the physical properties of metals and non-metals.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The opening source page begins by comparing the physical properties of metals and non-metals.</p></div>\n<div class=\"tip\"><strong>Picture this:</strong> Wires need ductility, foil needs malleability, and bells need sonority.</div>"}, {"m": 5, "t": "Useful Clues and Surprising Exceptions", "c": "<p>Most metals conduct heat and electricity well, which is why copper and aluminium are so useful. Many are sonorous too, so they produce a ringing sound when struck.</p>\n<p>But not every metal acts exactly the same. Sodium is soft enough to cut with a knife, and mercury is liquid at room temperature. Learning science means noticing patterns without forgetting exceptions.</p>\n<ul><li>Metals are usually hard, but sodium is soft.</li><li>Mercury is a liquid metal.</li><li>Most non-metals are poor conductors, but graphite is a useful exception.</li></ul>\n<div class=\"note\"><strong>Smart habit:</strong> A good science learner says “usually” when talking about properties, because exceptions matter.</div>"}, {"m": 5, "t": "Quiz: Metals and Non-metals - M0: Spotting Metals", "q": true}, {"m": 6, "t": "How Metals React", "c": "<p>Metals react with oxygen to form metal oxides, and many of those oxides are basic in nature. Some metals react quickly, some slowly, and some need heating. That difference in speed helps us compare reactivity.</p>\n<p>Metals can also react with water and acids. Very reactive metals like sodium and potassium react so strongly that they are stored carefully to stop unwanted contact with air or moisture.</p>\n<ul><li>More reactive metals react faster.</li><li>Metal + acid can give salt + hydrogen gas.</li><li>Sodium and potassium need very careful handling.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc103/page_previews/page_0006.png\" alt=\"The middle pages focus on how different metals react with oxygen, water, and acids.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The middle pages focus on how different metals react with oxygen, water, and acids.</p></div>\n<div class=\"warn\"><strong>Safety note:</strong> Highly reactive metals are never classroom toys. They must be handled with strict care.</div>"}, {"m": 6, "t": "Why Non-metals Behave Differently", "c": "<p>Non-metals often form acidic oxides when they react with oxygen. They usually do not react with acids in the same dramatic way that many metals do. That makes them easy to compare with metals in reaction tables.</p>\n<p>Some metal oxides, such as those of aluminium and zinc, can react with both acids and bases. These are called amphoteric oxides, a useful word that shows chemistry likes categories with edge cases.</p>\n<ul><li>Metal oxides are often basic.</li><li>Many non-metal oxides are acidic.</li><li>Amphoteric oxides can react with both acids and bases.</li></ul>\n<div class=\"real\"><strong>Thinking like a scientist:</strong> Instead of memorising one example, ask what pattern the example belongs to.</div>"}, {"m": 6, "t": "Quiz: Metals and Non-metals - M1: Reactions of Metals and Non-metals", "q": true}, {"m": 7, "t": "Why Reactivity Order Matters", "c": "<p>Some metals are very reactive, some are moderately reactive, and some are much less reactive. This order matters because a more reactive metal can often displace a less reactive metal from its compound.</p>\n<p>The same idea helps in extraction. Very reactive metals are harder to obtain from their ores, while less reactive metals can sometimes be found in a free state in nature.</p>\n<ul><li>A more reactive metal can replace a less reactive one.</li><li>Highly reactive metals are usually found as compounds.</li><li>Less reactive metals may be found free in nature.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc103/page_previews/page_0014.png\" alt=\"Later pages connect reactivity with extraction and natural occurrence of metals.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">Later pages connect reactivity with extraction and natural occurrence of metals.</p></div>\n<div class=\"note\"><strong>Useful clue:</strong> Reactivity helps explain both lab reactions and mining processes.</div>"}, {"m": 7, "t": "What Makes Ionic Compounds Special", "c": "<p>When metals react with non-metals, electrons can be transferred and ionic compounds can form. These compounds are often hard, have high melting points, and conduct electricity when molten or dissolved in water.</p>\n<p>That combination of properties makes ionic compounds very different from many covalent substances you meet later in carbon chemistry.</p>\n<ul><li>Ionic compounds are often hard solids.</li><li>They usually have high melting and boiling points.</li><li>They conduct electricity in molten state or in solution.</li></ul>\n<div class=\"tip\"><strong>Memory hook:</strong> solid ionic compounds hold ions tightly, but melted or dissolved ionic compounds let ions move around.</div>"}, {"m": 7, "t": "Quiz: Metals and Non-metals - M2: Reactivity and Ionic Compounds", "q": true}, {"m": 8, "t": "Why Rusting Is a Big Deal", "c": "<p>Metals are useful, but they can slowly get damaged. Iron rusts when it reacts with oxygen and moisture. This is a kind of corrosion, and it costs money, time, and effort because bridges, tools, and machines need protection.</p>\n<p>Science fights back with methods like painting, oiling, greasing, galvanising, and alloying. Each method tries to stop oxygen, water, or unwanted reactions from attacking the metal surface.</p>\n<ul><li>Corrosion damages metal objects.</li><li>Rusting is corrosion of iron.</li><li>Protective coatings slow down corrosion.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc103/page_previews/page_0018.png\" alt=\"The closing source pages connect metal science with alloys, corrosion, and daily use.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The closing source pages connect metal science with alloys, corrosion, and daily use.</p></div>\n<div class=\"real\"><strong>Everyday engineering:</strong> bicycles, gates, and water tanks last longer when metal surfaces are protected.</div>"}, {"m": 8, "t": "Why We Make Alloys", "c": "<p>Pure metals are not always the best choice. Gold is soft, iron can rust, and some metals need extra strength. An alloy is a mixture of metals, or a metal with a small amount of another element, made to improve useful properties.</p>\n<p>Brass, bronze, and steel are famous examples. Alloys can be harder, stronger, or more resistant to corrosion than the pure metals they come from.</p>\n<ul><li>An alloy is made to improve properties.</li><li>Steel is stronger than pure iron for many jobs.</li><li>Jewellery gold is often mixed with other metals for hardness.</li></ul>\n<div class=\"tip\"><strong>Design thinking:</strong> Scientists and engineers do not just ask “What is this metal?” They also ask “What job must this metal do?”</div>"}, {"m": 8, "t": "Quiz: Metals and Non-metals - M3: Corrosion, Alloys and Uses", "q": true}, {"m": 9, "t": "The Tiny Builder Element", "c": "<p>Carbon is special because it can form a huge variety of compounds. A big reason is tetravalency, which means one carbon atom can form four bonds. Another reason is catenation, which means carbon atoms can join to other carbon atoms to make chains, branches, and rings.</p>\n<p>That is why carbon shows up everywhere: food, fuels, fibres, medicines, plastics, and living bodies all rely on carbon chemistry.</p>\n<ul><li>Carbon can form four bonds.</li><li>Carbon atoms can join with one another.</li><li>Huge numbers of compounds become possible.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc104/page_previews/page_0001.png\" alt=\"The opening source page introduces carbon as a versatile element used in many daily-life materials.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The opening source page introduces carbon as a versatile element used in many daily-life materials.</p></div>\n<div class=\"tip\"><strong>Think of carbon like a smart connector toy:</strong> four joining points and lots of ways to build.</div>"}, {"m": 9, "t": "Covalent Bonds and Their Style", "c": "<p>In many carbon compounds, atoms share electrons instead of transferring them. That shared connection is called a covalent bond. Because of this bonding style, many carbon compounds have lower melting and boiling points than ionic compounds and usually do not conduct electricity.</p>\n<p>That difference in bonding explains a big difference in behaviour. Structure and properties are linked.</p>\n<ul><li>Covalent bonding involves sharing electrons.</li><li>Many carbon compounds are poor conductors.</li><li>Bonding helps explain properties.</li></ul>\n<div class=\"note\"><strong>Science shortcut:</strong> If you know the bonding style, you can often predict some properties.</div>"}, {"m": 9, "t": "Quiz: Carbon and its Compounds - M0: Why Carbon Is Special", "q": true}, {"m": 10, "t": "Saturated and Unsaturated Friends", "c": "<p>Hydrocarbons are compounds made of only carbon and hydrogen. If all carbon-carbon bonds are single, the compound is saturated. If double or triple bonds appear, the compound is unsaturated.</p>\n<p>That one change makes a big difference in reactivity. Unsaturated compounds can take part in addition reactions more easily.</p>\n<ul><li>Single bonds only -> saturated</li><li>Double or triple bonds -> unsaturated</li><li>Structure affects reactivity</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc104/page_previews/page_0010.png\" alt=\"The source pages group hydrocarbons into families and compare their formulas.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The source pages group hydrocarbons into families and compare their formulas.</p></div>\n<div class=\"tip\"><strong>Quick image:</strong> Saturated means “full” of single bonds. Unsaturated leaves room for extra joining.</div>"}, {"m": 10, "t": "Homologous Series Make Patterns Easy", "c": "<p>Chemists love patterns, and homologous series are a great example. Members of a homologous series have similar structures and similar chemical behaviour. Each next member differs by a small repeating unit.</p>\n<p>This means you do not need to memorise every compound separately. Once you understand the family pattern, many names and formulas make more sense.</p>\n<ul><li>Members of a homologous series show a pattern.</li><li>Similar structure often means similar chemical properties.</li><li>A repeating unit helps organise the family.</li></ul>\n<div class=\"note\"><strong>Pattern power:</strong> Science gets easier when you spot families instead of isolated facts.</div>"}, {"m": 10, "t": "Quiz: Carbon and its Compounds - M1: Hydrocarbons and Families", "q": true}, {"m": 11, "t": "Burning, Oxidation and Clean Flames", "c": "<p>Carbon compounds can burn to produce carbon dioxide, water, heat, and often light. A clean blue flame usually suggests more complete burning, while a yellow smoky flame suggests incomplete burning and soot formation.</p>\n<p>Some substances can also add oxygen to carbon compounds. That process is oxidation, and it changes one substance into another with different properties.</p>\n<ul><li>Combustion releases heat.</li><li>Oxidation adds oxygen or removes hydrogen in many cases.</li><li>Flame colour can hint at how complete the burning is.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc104/page_previews/page_0014.png\" alt=\"The middle source pages discuss oxidation and other reactions of carbon compounds.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The middle source pages discuss oxidation and other reactions of carbon compounds.</p></div>\n<div class=\"real\"><strong>Kitchen clue:</strong> A steady blue flame is usually a sign of better burning than a smoky yellow one.</div>"}, {"m": 11, "t": "Addition and Substitution", "c": "<p>Unsaturated compounds can undergo addition reactions because their multiple bonds can open up and attach new atoms. Saturated compounds, especially under special conditions, often show substitution reactions instead, where one atom is replaced by another.</p>\n<p>These reaction types help us compare families of carbon compounds and predict what kind of changes they can undergo.</p>\n<ul><li>Addition is linked strongly with unsaturation.</li><li>Substitution is common in some saturated compounds.</li><li>Bond type influences reaction type.</li></ul>\n<div class=\"tip\"><strong>Memory trick:</strong> Addition fills an open spot. Substitution swaps one partner for another.</div>"}, {"m": 11, "t": "Quiz: Carbon and its Compounds - M2: Useful Reactions of Carbon Compounds", "q": true}, {"m": 12, "t": "From Useful Liquids to Useful Acids", "c": "<p>Ethanol is a familiar carbon compound with many uses, but it must be handled responsibly because it is flammable and can be harmful when misused. Ethanoic acid is another important compound and is linked with vinegar in dilute form.</p>\n<p>These two examples help children see that carbon chemistry is not just about formulas. It is about real materials with real uses, real benefits, and real safety rules.</p>\n<ul><li>Ethanol is flammable.</li><li>Ethanoic acid is related to vinegar.</li><li>Useful chemicals also need safe handling.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc104/page_previews/page_0018.png\" alt=\"The later source pages connect carbon compounds with alcohols, acids, soap, and cleaning action.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The later source pages connect carbon compounds with alcohols, acids, soap, and cleaning action.</p></div>\n<div class=\"warn\"><strong>Safety reminder:</strong> Useful does not mean harmless. Science always combines knowledge with care.</div>"}, {"m": 12, "t": "Why Soap Can Clean Oily Dirt", "c": "<p>Water alone cannot remove oily dirt well, but soap molecules are clever. One end of a soap molecule is attracted to water, and the other end is attracted to oil. That helps break greasy dirt into tiny droplets that water can wash away.</p>\n<p>Detergents are also cleaning agents, but soaps are a beautiful example of how molecular structure explains a common daily-life effect.</p>\n<ul><li>Soap works because it can connect with both water and oil.</li><li>Grease gets trapped in tiny droplets called micelles.</li><li>Cleaning action is really a story about molecular design.</li></ul>\n<div class=\"note\"><strong>Big idea:</strong> Tiny molecules can create big changes that you can see with your eyes.</div>"}, {"m": 12, "t": "Quiz: Carbon and its Compounds - M3: Ethanol, Ethanoic Acid and Soap", "q": true}, {"m": 13, "t": "Life Means Constant Work", "c": "<p>Living things are not alive only when they run, jump, or wave. Even when you are resting, your body is still busy. Cells keep repairing, moving materials, making energy available, and maintaining order inside the body.</p>\n<p>That is why life processes matter. They are the quiet jobs that keep organisms alive all the time, even when no obvious movement can be seen.</p>\n<ul><li>Life needs continuous maintenance.</li><li>Molecular movement inside the body matters.</li><li>Visible movement alone is not enough to define life.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc105/page_previews/page_0001.png\" alt=\"The opening source page explains that life depends on invisible maintenance processes, not only visible movement.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The opening source page explains that life depends on invisible maintenance processes, not only visible movement.</p></div>\n<div class=\"tip\"><strong>Think deeper:</strong> A sleeping dog is alive because many hidden processes are still happening.</div>"}, {"m": 13, "t": "Nutrition Starts the Story", "c": "<p>Organisms need materials to grow, repair, and release energy. Green plants make food through photosynthesis, while animals and humans depend on eating other organisms or their products.</p>\n<p>Nutrition is therefore the first big survival system. Without food or a way to make food, the rest of the body's processes cannot keep going for long.</p>\n<ul><li>Plants are autotrophs because they make food.</li><li>Animals are heterotrophs because they depend on ready-made food.</li><li>Food supports growth, repair, and energy release.</li></ul>\n<div class=\"note\"><strong>Word power:</strong> “auto” means self, so an autotroph makes its own food.</div>"}, {"m": 13, "t": "Quiz: Life Processes - M0: What Keeps Living Things Alive", "q": true}, {"m": 14, "t": "Why Food Alone Is Not Enough", "c": "<p>Food stores energy, but that energy must be released in a usable way. Respiration breaks down food to release energy that cells can use. This happens inside the body all the time.</p>\n<p>Breathing and respiration are connected, but they are not exactly the same thing. Breathing moves air in and out, while respiration is the chemical process that releases energy from food.</p>\n<ul><li>Breathing is movement of air.</li><li>Respiration releases energy from food.</li><li>Oxygen helps complete aerobic respiration.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc105/page_previews/page_0010.png\" alt=\"Middle source pages explain how respiration releases energy from food and how gas exchange supports it.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">Middle source pages explain how respiration releases energy from food and how gas exchange supports it.</p></div>\n<div class=\"tip\"><strong>Easy distinction:</strong> Breathing is the door. Respiration is what happens inside the room.</div>"}, {"m": 14, "t": "Different Paths of Respiration", "c": "<p>When oxygen is available, cells can release more energy through aerobic respiration. When oxygen is limited, some organisms or body cells may use anaerobic pathways instead. That can lead to different end products.</p>\n<p>This matters in real life. Muscles working very hard may not get oxygen fast enough for every cell all the time, which is one reason the body can feel tired or strained.</p>\n<ul><li>Aerobic respiration uses oxygen.</li><li>Anaerobic respiration happens without enough oxygen.</li><li>Energy release and end products can differ.</li></ul>\n<div class=\"real\"><strong>Sports link:</strong> Heavy exercise reminds you that respiration is not just a textbook idea.</div>"}, {"m": 14, "t": "Quiz: Life Processes - M1: Respiration and Breathing", "q": true}, {"m": 15, "t": "The Body Needs Delivery Systems", "c": "<p>Cells are spread throughout the body, so oxygen, food, water, and wastes cannot stay in one place. Transport systems move these materials where they need to go. In humans, blood and the heart play the central role.</p>\n<p>The heart works like a powerful pump. Blood carries oxygen, nutrients, hormones, and wastes through vessels so cells can keep functioning.</p>\n<ul><li>The heart pumps blood.</li><li>Blood carries oxygen and nutrients.</li><li>Transport also helps remove wastes.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc105/page_previews/page_0014.png\" alt=\"The transport pages focus on the heart, blood flow, and movement of materials inside the body.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The transport pages focus on the heart, blood flow, and movement of materials inside the body.</p></div>\n<div class=\"note\"><strong>Big picture:</strong> A transport system is a delivery and cleanup network at the same time.</div>"}, {"m": 15, "t": "Plants Also Need Transport", "c": "<p>Plants may not have a heart, but they still need transport. Water and minerals move upward from the roots through xylem, while prepared food can move through phloem to places that need it.</p>\n<p>This shows one of the most beautiful ideas in biology: different organisms solve the same problem in different ways.</p>\n<ul><li>Xylem mainly carries water and minerals.</li><li>Phloem carries prepared food.</li><li>Transport is essential in both plants and animals.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc105/page_previews/page_0018.png\" alt=\"Later source pages describe xylem and phloem as transport tissues in plants.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">Later source pages describe xylem and phloem as transport tissues in plants.</p></div>\n<div class=\"tip\"><strong>Memory trick:</strong> Xylem lifts water up. Phloem shares food around.</div>"}, {"m": 15, "t": "Quiz: Life Processes - M2: Transport in Bodies and Plants", "q": true}, {"m": 16, "t": "Cleaning Up the Body", "c": "<p>Life processes create wastes as well as useful products. If those wastes stay inside too long, they can harm the body. Excretion removes these unwanted materials and helps keep internal conditions balanced.</p>\n<p>In humans, kidneys filter the blood and form urine. Tiny units called nephrons do the filtering work, proving again that big body jobs depend on tiny structures.</p>\n<ul><li>Excretion removes harmful wastes.</li><li>Kidneys filter the blood.</li><li>Nephrons are the tiny filtering units.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc105/page_previews/page_0020.png\" alt=\"The final pages cover excretion and how the body filters wastes.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The final pages cover excretion and how the body filters wastes.</p></div>\n<div class=\"real\"><strong>Body wisdom:</strong> Survival is not only about taking things in. It is also about removing the right things.</div>"}, {"m": 16, "t": "Balance Matters in Plants Too", "c": "<p>Plants also handle extra materials and water balance in their own ways. Stomata help in gas exchange and water loss, while transport tissues and surrounding cells help manage movement and pressure inside the plant.</p>\n<p>Across humans and plants, one shared truth appears again and again: life survives by maintaining balance through many connected processes.</p>\n<ul><li>Excretion and balance support life.</li><li>Plants also regulate water and gases.</li><li>Life processes work as a team, not as separate islands.</li></ul>\n<div class=\"tip\"><strong>Final thought:</strong> Nutrition, respiration, transport, and excretion are like teammates keeping the organism stable.</div>"}, {"m": 16, "t": "Quiz: Life Processes - M3: Excretion and Balance", "q": true}, {"m": 17, "t": "Life Responds to Change", "c": "<p>Living things do not just move for no reason. They notice what is happening and then react.</p>\n<p>The chapter starts with familiar examples like a cat chasing a mouse, a child pulling away from heat, and a plant turning toward sunlight.</p>\n<ul><li>Movement can be a response to the environment.</li><li>The response is controlled, not random.</li><li>Different situations need different actions.</li></ul>\n<div class=\"note\"><strong>Big idea:</strong> control and coordination help an organism choose the right response at the right time.</div>\n<figure class=\"preview\">\n  <img src=\"../jesc106/page_previews/page_0001.png\" alt=\"Opening page showing how living things respond to the world around them.\">\n  <figcaption>Opening page showing how living things respond to the world around them.</figcaption>\n</figure>"}, {"m": 17, "t": "How a Nerve Message Travels", "c": "<p>Nerve cells carry information as electrical impulses. The message starts at the dendrite, moves through the cell body, goes along the axon, and crosses the synapse to the next cell.</p>\n<p>Receptors in sense organs notice the change first. Gustatory receptors sense taste, and olfactory receptors sense smell.</p>\n<ul><li>Receptors detect the stimulus.</li><li>A neuron carries the impulse.</li><li>The synapse passes the message on.</li></ul>\n<figure class=\"preview\">\n  <img src=\"../jesc106/page_previews/page_0002.png\" alt=\"Neuron diagram and the first look at sense organs and synapses.\">\n  <figcaption>Neuron diagram and the first look at sense organs and synapses.</figcaption>\n</figure>"}, {"m": 17, "t": "Quiz: Control and Coordination Workshop - M0: Why the Body Needs Control", "q": true}, {"m": 18, "t": "Reflex Actions Are Super Fast", "c": "<p>A reflex action is a quick, automatic response to something that could hurt you. Touching a hot pan is the classic example.</p>\n<p>The signal uses a reflex arc, and the spinal cord helps the body react quickly.</p>\n<ul><li>Reflex actions are automatic.</li><li>They protect the body from danger.</li><li>The spinal cord helps make the response fast.</li></ul>\n<figure class=\"preview\">\n  <img src=\"../jesc106/page_previews/page_0003.png\" alt=\"The chapter moves into reflex actions and the reflex arc.\">\n  <figcaption>The chapter moves into reflex actions and the reflex arc.</figcaption>\n</figure>"}, {"m": 18, "t": "The Brain Keeps the Plan Together", "c": "<p>The brain helps control thinking, balance, memory, and many other actions. The cerebrum helps with thinking, the cerebellum helps with balance, and the medulla handles life-support jobs.</p>\n<p>It is protected by the skull, meninges, and a fluid cushion around it.</p>\n<ul><li>Cerebrum: thinking and learning</li><li>Cerebellum: balance and movement</li><li>Medulla: breathing and heartbeat control</li></ul>\n<figure class=\"preview\">\n  <img src=\"../jesc106/page_previews/page_0005.png\" alt=\"Brain structure pages with the main regions and their jobs.\">\n  <figcaption>Brain structure pages with the main regions and their jobs.</figcaption>\n</figure>"}, {"m": 18, "t": "Quiz: Control and Coordination Workshop - M1: Reflexes and the Brain", "q": true}, {"m": 19, "t": "The Sensitive Plant Responds Right Away", "c": "<p>Plants also respond to the world around them. The sensitive plant folds its leaves when touched.</p>\n<p>This is an immediate response, but it is not the same as growth.</p>\n<ul><li>Touch can trigger a quick plant response.</li><li>Some plant movements are not growth based.</li><li>Plants still need coordination.</li></ul>\n<figure class=\"preview\">\n  <img src=\"../jesc106/page_previews/page_0007.png\" alt=\"The plant example shows an immediate response to touch.\">\n  <figcaption>The plant example shows an immediate response to touch.</figcaption>\n</figure>"}, {"m": 19, "t": "Growth Movements Are Directional", "c": "<p>Some plant movements happen because of growth. A shoot bends toward light, and roots grow downward into the soil. These are called tropisms.</p>\n<p>Plants may look still, but they are constantly adjusting their growth to match the environment.</p>\n<ul><li>Phototropism: growth in response to light</li><li>Geotropism: growth in response to gravity</li><li>Growth movements are slow but important</li></ul>\n<figure class=\"preview\">\n  <img src=\"../jesc106/page_previews/page_0010.png\" alt=\"Pages on tropisms show how roots and shoots bend because of growth.\">\n  <figcaption>Pages on tropisms show how roots and shoots bend because of growth.</figcaption>\n</figure>"}, {"m": 19, "t": "Quiz: Control and Coordination Workshop - M2: Plants Respond Too", "q": true}, {"m": 20, "t": "Hormones in Animals", "c": "<p>Hormones are chemical messengers. They move through the blood and tell another part of the body what to do.</p>\n<p>Growth hormone helps the body grow, insulin helps control blood sugar, and adrenaline helps you react in an emergency.</p>\n<ul><li>Growth hormone supports growth.</li><li>Insulin controls blood sugar.</li><li>Adrenaline prepares the body for danger.</li></ul>\n<figure class=\"preview\">\n  <img src=\"../jesc106/page_previews/page_0011.png\" alt=\"Endocrine glands and their hormone jobs are shown on this page.\">\n  <figcaption>Endocrine glands and their hormone jobs are shown on this page.</figcaption>\n</figure>"}, {"m": 20, "t": "Feedback Keeps Hormones Balanced", "c": "<p>The nervous system and hormone system work together. The nervous system is fast and precise. Hormones are slower but useful for long-range control.</p>\n<p>Plants also use chemical signals to coordinate growth and response.</p>\n<div class=\"note\"><strong>Final memory line:</strong> nerves send quick messages, hormones send long-range messages, and both help the body stay organized.</div>\n<figure class=\"preview\">\n  <img src=\"../jesc106/page_previews/page_0013.png\" alt=\"The end of the chapter summarizes the big ideas for revision.\">\n  <figcaption>The end of the chapter summarizes the big ideas for revision.</figcaption>\n</figure>"}, {"m": 20, "t": "Quiz: Control and Coordination Workshop - M3: Hormones Do the Long-Range Work", "q": true}, {"m": 21, "t": "Why Organisms Reproduce", "c": "<p>Reproduction is not needed for one individual to stay alive, but it is needed for a species to continue.</p>\n<p>New individuals look like their parents, so the species keeps its body design from one generation to the next.</p>\n<ul><li>Reproduction keeps a species going.</li><li>New individuals look like their parents.</li><li>A species is easier to notice when many members exist.</li></ul>\n<figure class=\"preview\">\n  <img src=\"../jesc107/page_previews/page_0001.png\" alt=\"The chapter opens by asking why living things reproduce at all.\">\n  <figcaption>The chapter opens by asking why living things reproduce at all.</figcaption>\n</figure>"}, {"m": 21, "t": "DNA Copying Creates Variation", "c": "<p>Reproduction begins with copying DNA. That copy is usually close to the original, but not always perfect.</p>\n<p>Small changes create variation, and variation can help some members survive when the world changes.</p>\n<ul><li>DNA copying starts reproduction.</li><li>Small copy errors create variation.</li><li>Variation can help survival.</li></ul>\n<figure class=\"preview\">\n  <img src=\"../jesc107/page_previews/page_0002.png\" alt=\"Pages explain how DNA copying and variation happen during reproduction.\">\n  <figcaption>Pages explain how DNA copying and variation happen during reproduction.</figcaption>\n</figure>"}, {"m": 21, "t": "Quiz: How Do Organisms Reproduce? Workshop - M0: Why Reproduction Matters", "q": true}, {"m": 22, "t": "One Parent, Many Ways", "c": "<p>Asexual reproduction uses one parent. The new individual comes from a single organism, so the process is often simple and fast.</p>\n<p>The chapter covers fission, fragmentation, regeneration, budding, vegetative propagation, and spore formation.</p>\n<ul><li>Fission splits one cell into two or more cells.</li><li>Budding forms a small outgrowth.</li><li>Vegetative propagation uses roots, stems, or leaves.</li></ul>\n<figure class=\"preview\">\n  <img src=\"../jesc107/page_previews/page_0003.png\" alt=\"The source pages show several asexual methods in simple organisms and plants.\">\n  <figcaption>The source pages show several asexual methods in simple organisms and plants.</figcaption>\n</figure>"}, {"m": 22, "t": "Fragments, Buds, and Spores", "c": "<p>Hydra can grow a bud that becomes a new individual. Some organisms can regenerate lost parts. Fungi and some plants use spores, which are tiny units that can spread easily.</p>\n<p>Vegetative propagation is useful in plants because a root, stem, or leaf can grow into a new plant that keeps the same useful traits.</p>\n<ul><li>Hydra shows budding.</li><li>Planaria shows regeneration.</li><li>Spores help organisms spread widely.</li></ul>\n<figure class=\"preview\">\n  <img src=\"../jesc107/page_previews/page_0006.png\" alt=\"Later pages focus on regeneration, budding, and spore formation.\">\n  <figcaption>Later pages focus on regeneration, budding, and spore formation.</figcaption>\n</figure>"}, {"m": 22, "t": "Quiz: How Do Organisms Reproduce? Workshop - M1: Asexual Reproduction", "q": true}, {"m": 23, "t": "Pollination Comes First", "c": "<p>Sexual reproduction in flowering plants begins with pollination, which is the transfer of pollen grains from the anther to the stigma.</p>\n<p>The chapter uses the flower diagram to help you see where pollen starts, where it lands, and how the next steps create seeds and fruits.</p>\n<ul><li>Anther makes pollen grains.</li><li>Stigma receives pollen.</li><li>Fertilisation happens after pollination.</li></ul>\n<figure class=\"preview\">\n  <img src=\"../jesc107/page_previews/page_0009.png\" alt=\"The source pages show flower parts and the movement of pollen grains.\">\n  <figcaption>The source pages show flower parts and the movement of pollen grains.</figcaption>\n</figure>"}, {"m": 23, "t": "Fertilisation Makes a New Beginning", "c": "<p>After fertilisation, the ovule develops into a seed and the ovary develops into a fruit.</p>\n<p>Because sexual reproduction mixes genetic material from two parents, the offspring can show more variation than asexual offspring.</p>\n<ul><li>Pollination moves pollen.</li><li>Fertilisation joins the gametes.</li><li>Seeds carry the embryo of the next plant.</li></ul>\n<figure class=\"preview\">\n  <img src=\"../jesc107/page_previews/page_0010.png\" alt=\"Later pages connect pollen, ovule, seed, and fruit in a simple sequence.\">\n  <figcaption>Later pages connect pollen, ovule, seed, and fruit in a simple sequence.</figcaption>\n</figure>"}, {"m": 23, "t": "Quiz: How Do Organisms Reproduce? Workshop - M2: Sexual Reproduction in Flowering Plants", "q": true}, {"m": 24, "t": "Puberty Means the Body Is Maturing", "c": "<p>Puberty is the time when the body becomes able to reproduce. Girls and boys both go through changes.</p>\n<p>The male reproductive system includes testes, vas deferens, seminal vesicles, prostate gland, urethra, and penis. The female reproductive system includes ovaries, fallopian tubes, uterus, and vagina.</p>\n<figure class=\"preview\">\n  <img src=\"../jesc107/page_previews/page_0011.png\" alt=\"The chapter uses body changes at puberty as a sign of sexual maturation.\">\n  <figcaption>The chapter uses body changes at puberty as a sign of sexual maturation.</figcaption>\n</figure>"}, {"m": 24, "t": "Fertilisation, Embryo, and Health", "c": "<p>In human beings, fertilisation usually happens in the fallopian tube. The embryo gets nourishment from the mother through the placenta.</p>\n<p>The chapter also talks about reproductive health and contraception. Condoms, oral pills, and copper-T are examples of methods used to avoid pregnancy.</p>\n<ul><li>Sperm is introduced into the vagina.</li><li>Fertilisation happens in the fallopian tube.</li><li>Reproductive health includes safe choices and protection.</li></ul>\n<figure class=\"preview\">\n  <img src=\"../jesc107/page_previews/page_0014.png\" alt=\"The later pages explain fertilisation, the embryo, and ways to avoid pregnancy.\">\n  <figcaption>The later pages explain fertilisation, the embryo, and ways to avoid pregnancy.</figcaption>\n</figure>"}, {"m": 24, "t": "Quiz: How Do Organisms Reproduce? Workshop - M3: Human Reproduction and Health", "q": true}, {"m": 25, "t": "Why Variation Matters", "c": "<p>The chapter starts with a simple picture: children look like their parents, but not exactly. That small difference is called variation.</p>\n<p>Variation can be useful because it gives a species a better chance of surviving changes in the environment.</p>\n<ul><li>Offspring are similar, not identical.</li><li>Variation appears during reproduction.</li><li>Variation can help survival.</li></ul>\n<figure class=\"preview\">\n  <img src=\"../jesc108/page_previews/page_0001.png\" alt=\"The opening pages show that offspring are similar but not identical.\">\n  <figcaption>The opening pages show that offspring are similar but not identical.</figcaption>\n</figure>"}, {"m": 25, "t": "Heredity Passes Traits On", "c": "<p>Heredity means passing traits from parents to offspring. The chapter uses examples such as earlobes and eye colour to show this.</p>\n<p>At the same time, the chapter reminds us that traits can vary in a population.</p>\n<div class=\"note\"><strong>Big picture:</strong> heredity keeps the family likeness, while variation adds the differences.</div>\n<figure class=\"preview\">\n  <img src=\"../jesc108/page_previews/page_0002.png\" alt=\"The early chapter pages connect inherited traits to the next generation.\">\n  <figcaption>The early chapter pages connect inherited traits to the next generation.</figcaption>\n</figure>"}, {"m": 25, "t": "Quiz: Heredity Workshop - M0: Variation and Inheritance", "q": true}, {"m": 26, "t": "A Tall Plant Can Hide a Short Trait", "c": "<p>Mendel crossed pea plants with contrasting traits, such as tall and short. In the first generation, all the plants were tall.</p>\n<p>When the first generation self-pollinated, the second generation showed both tall and short plants.</p>\n<figure class=\"preview\">\n  <img src=\"../jesc108/page_previews/page_0003.png\" alt=\"The pages explain how Mendel studied tall and short pea plants.\">\n  <figcaption>The pages explain how Mendel studied tall and short pea plants.</figcaption>\n</figure>"}, {"m": 26, "t": "Two Traits Can Be Inherited Independently", "c": "<p>Mendel also studied more than one trait at a time. He found that shape and colour of seeds could be inherited independently.</p>\n<p>The chapter also gives the idea of dominant and recessive traits. If a trait appears with one copy, it is dominant. If it shows only when both copies are the same, it is recessive.</p>\n<ul><li>Dominant trait: shows with one copy</li><li>Recessive trait: shows only with two matching copies</li><li>Independent inheritance can create new combinations</li></ul>\n<figure class=\"preview\">\n  <img src=\"../jesc108/page_previews/page_0004.png\" alt=\"The next page shows the famous pea experiment with seed shape and seed colour.\">\n  <figcaption>The next page shows the famous pea experiment with seed shape and seed colour.</figcaption>\n</figure>"}, {"m": 26, "t": "Quiz: Heredity Workshop - M1: Mendel's Pea Experiments", "q": true}, {"m": 27, "t": "Genes Help Make Proteins", "c": "<p>A gene is a section of DNA that gives instructions for making a protein. Proteins help create the traits we see.</p>\n<p>The chapter also explains that chromosomes carry genes. Each parent gives one copy, so sexually reproducing organisms usually have two copies of each gene.</p>\n<figure class=\"preview\">\n  <img src=\"../jesc108/page_previews/page_0005.png\" alt=\"The chapter explains how genes, chromosomes, and traits fit together.\">\n  <figcaption>The chapter explains how genes, chromosomes, and traits fit together.</figcaption>\n</figure>"}, {"m": 27, "t": "XX, XY, and the Father&#x27;s Role", "c": "<p>In humans, sex is usually determined by chromosomes. Females have XX and males have XY. The mother gives an X chromosome to every child. The father gives either X or Y.</p>\n<p>If the father gives X, the child is a girl. If the father gives Y, the child is a boy.</p>\n<div class=\"note\"><strong>Short summary:</strong> genes guide traits, chromosomes carry genes, and X or Y helps decide sex in humans.</div>\n<figure class=\"preview\">\n  <img src=\"../jesc108/page_previews/page_0006.png\" alt=\"The final page shows how sex is determined in human beings.\">\n  <figcaption>The final page shows how sex is determined in human beings.</figcaption>\n</figure>"}, {"m": 27, "t": "Quiz: Heredity Workshop - M2: Genes, Chromosomes, and Sex Determination", "q": true}, {"m": 28, "t": "Seeing Needs Light", "c": "<p>We see objects when light reaches our eyes after bouncing off them or passing through them.</p>\n<p>The chapter begins with a simple idea: in a dark room, objects are hard to see because no useful light is reaching the eye.</p>\n<ul><li>Light helps us see objects.</li><li>Reflection happens when light bounces from a surface.</li><li>A shadow or a mirror clue can tell us how light is moving.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc109/page_previews/page_0001.png\" alt=\"The opening source page introduces straight-line travel of light and the first ideas about reflection.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The opening source page introduces straight-line travel of light and the first ideas about reflection.</p></div>\n<div class=\"note\"><strong>Big idea:</strong> light is the messenger that lets us see other things.</div>"}, {"m": 28, "t": "The Two Laws of Reflection", "c": "<p>The chapter states two simple rules for reflection: angle of incidence equals angle of reflection, and the incident ray, normal, and reflected ray all lie in the same plane.</p>\n<p>Those rules explain why mirror images are so regular. A surface does not guess where to send light. It follows the same pattern every time.</p>\n<ul><li>Angle of incidence = angle of reflection.</li><li>The incident ray, normal, and reflected ray stay in one plane.</li><li>Plane-mirror images are virtual, erect, and laterally inverted.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc109/page_previews/page_0002.png\" alt=\"The early source pages list the laws of reflection and introduce image properties in a plane mirror.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The early source pages list the laws of reflection and introduce image properties in a plane mirror.</p></div>\n<div class=\"tip\"><strong>Memory trick:</strong> the mirror is fair. It gives the same angle back that it receives.</div>"}, {"m": 28, "t": "Quiz: Light - M0: Light Helps Us See", "q": true}, {"m": 29, "t": "Spoon Shapes and Spherical Mirrors", "c": "<p>A shiny spoon can behave a little like a curved mirror. The inward-curved side acts like a concave mirror, while the outward-curved side acts like a convex mirror.</p>\n<p>The chapter names the pole, centre of curvature, principal axis, and focus so we can talk about curved mirrors precisely.</p>\n<ul><li>Concave mirrors curve inward.</li><li>Convex mirrors curve outward.</li><li>The pole, focus, and centre of curvature help describe the mirror shape.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc109/page_previews/page_0003.png\" alt=\"The source pages introduce spherical mirrors and the key points used to describe them.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The source pages introduce spherical mirrors and the key points used to describe them.</p></div>\n<div class=\"real\"><strong>Kid picture:</strong> one spoon side can make things look bigger; the other can give a wider view.</div>"}, {"m": 29, "t": "What Mirror Formula and Magnification Say", "c": "<p>Concave mirrors can bring parallel rays together at a focus. Convex mirrors spread rays out as if they came from a point behind the mirror.</p>\n<p>The chapter gives the mirror formula and magnification so you can predict image position and size. For spherical mirrors, 1/v + 1/u = 1/f, and magnification is m = -v/u.</p>\n<ul><li>Concave mirrors can form real or virtual images.</li><li>Convex mirrors usually give virtual, upright, smaller images.</li><li>Magnification compares image height with object height.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc109/page_previews/page_0005.png\" alt=\"Later pages in the mirror section show image formation, sign convention, and the mirror formula.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">Later pages in the mirror section show image formation, sign convention, and the mirror formula.</p></div>\n<div class=\"note\"><strong>Rule of thumb:</strong> if a mirror lets you see more of the world behind you, it is usually convex.</div>"}, {"m": 29, "t": "Quiz: Light - M1: Curved Mirrors and Images", "q": true}, {"m": 30, "t": "Why Light Bends at a Boundary", "c": "<p>Refraction happens when light moves from one transparent medium to another and changes direction.</p>\n<p>A pencil in water can look bent, and text under a glass slab can look raised because light takes a different path in the new medium.</p>\n<ul><li>Refraction means bending at a boundary.</li><li>Air to glass: bend toward the normal.</li><li>Glass to air: bend away from the normal.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc109/page_previews/page_0013.png\" alt=\"The refraction section starts with common examples such as a pencil in water and a raised-looking line under glass.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The refraction section starts with common examples such as a pencil in water and a raised-looking line under glass.</p></div>\n<div class=\"tip\"><strong>Easy picture:</strong> light changes lanes when the material changes.</div>"}, {"m": 30, "t": "Glass Slabs and Refractive Index", "c": "<p>A rectangular glass slab gives a neat result: the emergent ray is parallel to the incident ray, although it is shifted sideways.</p>\n<p>The chapter also introduces refractive index, which compares the speed of light in vacuum with the speed of light in a medium.</p>\n<ul><li>A glass slab produces lateral displacement.</li><li>The emergent ray stays parallel to the incident ray.</li><li>Refractive index helps compare how strongly a medium bends light.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc109/page_previews/page_0014.png\" alt=\"The source pages explain refraction through a glass slab and how the ray shifts sideways.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The source pages explain refraction through a glass slab and how the ray shifts sideways.</p></div>\n<div class=\"real\"><strong>Think like a detective:</strong> if a pencil looks broken in water, the pencil did not actually break.</div>"}, {"m": 30, "t": "Quiz: Light - M2: Refraction in Glass", "q": true}, {"m": 31, "t": "How Lenses Form Images", "c": "<p>A lens is a transparent material with at least one curved surface. Convex lenses bring rays together, while concave lenses spread them apart.</p>\n<p>The chapter shows that lenses can make images that are real or virtual depending on where the object is placed.</p>\n<ul><li>Convex lenses converge light.</li><li>Concave lenses diverge light.</li><li>Lens images can be real or virtual.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc109/page_previews/page_0018.png\" alt=\"The lens section of the source chapter introduces image formation for convex and concave lenses.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The lens section of the source chapter introduces image formation for convex and concave lenses.</p></div>\n<div class=\"note\"><strong>Picture it:</strong> a convex lens acts like a light helper that pulls rays together.</div>"}, {"m": 31, "t": "Lens Formula and Power", "c": "<p>The chapter gives the lens formula 1/v - 1/u = 1/f and uses the same style of sign convention as mirrors, but measured from the optical centre.</p>\n<p>It also defines power as the reciprocal of focal length. Power is useful because a lens with a short focal length bends light more strongly.</p>\n<ul><li>Lens formula: 1/v - 1/u = 1/f</li><li>Power P = 1/f</li><li>Power is measured in dioptres (D).</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc109/page_previews/page_0025.png\" alt=\"The later pages summarize sign convention, the lens formula, and the power of a lens.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The later pages summarize sign convention, the lens formula, and the power of a lens.</p></div>\n<div class=\"tip\"><strong>Fast rule:</strong> shorter focal length means stronger lens power.</div>"}, {"m": 31, "t": "Quiz: Light - M3: Lenses and Focus", "q": true}, {"m": 32, "t": "A Living Camera", "c": "<p>The human eye helps us see the world by focusing light on the retina. The cornea does the first bending, the lens makes fine adjustments, and the brain reads the signals.</p>\n<p>The chapter compares the eye with a camera because both form an image on a light-sensitive surface. In the eye, that surface is the retina.</p>\n<ul><li>Cornea and lens bend light.</li><li>The pupil controls how much light enters.</li><li>The retina receives the image and sends signals onward.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc110/page_previews/page_0001.png\" alt=\"The opening pages introduce the human eye as a light-focusing system that forms images on the retina.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The opening pages introduce the human eye as a light-focusing system that forms images on the retina.</p></div>\n<div class=\"note\"><strong>Big idea:</strong> seeing is a teamwork job between the eye and the brain.</div>"}, {"m": 32, "t": "How the Eye Adjusts Focus", "c": "<p>The eye can focus on both near and far objects because the lens changes shape. This ability is called accommodation.</p>\n<p>A normal young eye can see clearly from about 25 cm to far away. That nearest clear distance is called the near point or least distance of distinct vision.</p>\n<ul><li>Accommodation means changing focal length.</li><li>The near point is about 25 cm for a normal young eye.</li><li>Ciliary muscles help the lens change shape.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc110/page_previews/page_0002.png\" alt=\"The next source pages explain accommodation and the near point of a normal eye.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The next source pages explain accommodation and the near point of a normal eye.</p></div>\n<div class=\"tip\"><strong>Memory shortcut:</strong> near objects need a stronger bend, far objects need a gentler bend.</div>"}, {"m": 32, "t": "Quiz: The Human Eye and the Colourful World - M0: Meet the Human Eye", "q": true}, {"m": 33, "t": "Myopia and Hypermetropia", "c": "<p>Myopia, or near-sightedness, means distant objects look blurry while nearby ones look clear. Hypermetropia, or far-sightedness, means nearby objects look blurry while distant ones look clear.</p>\n<p>The chapter shows that myopia is corrected with a concave lens, and hypermetropia is corrected with a convex lens.</p>\n<ul><li>Myopia affects distant vision.</li><li>Hypermetropia affects near vision.</li><li>Concave and convex lenses can correct these defects.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc110/page_previews/page_0003.png\" alt=\"The defect-of-vision pages compare myopia and hypermetropia and show how spectacles correct them.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The defect-of-vision pages compare myopia and hypermetropia and show how spectacles correct them.</p></div>\n<div class=\"real\"><strong>Kid clue:</strong> if the blackboard looks fuzzy from the back row, the eye may need a different lens shape.</div>"}, {"m": 33, "t": "Presbyopia and Cataract", "c": "<p>As people age, the eye can lose some of its accommodation power. That age-related problem is called presbyopia. Another condition mentioned in the chapter is cataract, where the lens becomes cloudy and vision becomes impaired.</p>\n<p>The important lesson is that good vision depends on healthy focusing parts. When one part changes, a suitable lens or surgery may be needed to help again.</p>\n<ul><li>Presbyopia is age-related loss of accommodation.</li><li>Cataract makes the lens cloudy.</li><li>Eye care can include lenses or surgery depending on the problem.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc110/page_previews/page_0004.png\" alt=\"The source pages continue with presbyopia, near point changes, and cataract.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The source pages continue with presbyopia, near point changes, and cataract.</p></div>\n<div class=\"tip\"><strong>Friendly reminder:</strong> normal vision is not the same as perfect vision forever. Eyes can change with age.</div>"}, {"m": 33, "t": "Quiz: The Human Eye and the Colourful World - M1: Vision Problems and Fixes", "q": true}, {"m": 34, "t": "White Light Has Many Colours", "c": "<p>A prism can spread white light into a band of colours. The chapter calls this dispersion.</p>\n<p>It also explains that the angle of deviation is the amount by which the emergent ray turns away from the original direction.</p>\n<ul><li>Dispersion means splitting white light into colours.</li><li>A prism bends different colours by different amounts.</li><li>The angle of deviation measures the turn in the ray.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc110/page_previews/page_0005.png\" alt=\"The prism activity shows how white light can split into a colourful band.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The prism activity shows how white light can split into a colourful band.</p></div>\n<div class=\"note\"><strong>Picture to keep:</strong> a prism is like a colour sorter for light.</div>"}, {"m": 34, "t": "Rainbows and Colour in Nature", "c": "<p>The chapter uses the same physics to explain rainbows and other colour effects. Sunlight can split into colours, and the atmosphere can also bend or scatter light so that the sky looks different at different times of day.</p>\n<p>The important habit is to link the colourful scene back to light behaviour: refraction, dispersion, and scattering all play a part.</p>\n<ul><li>Rainbows are linked with dispersion and refraction.</li><li>The atmosphere can also change the look of light.</li><li>Colour patterns in nature have physical reasons.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc110/page_previews/page_0006.png\" alt=\"Later pages connect dispersion with rainbow formation and colour effects in nature.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">Later pages connect dispersion with rainbow formation and colour effects in nature.</p></div>\n<div class=\"real\"><strong>Nature clue:</strong> a rainbow is not paint in the sky. It is sunlight being split and bent.</div>"}, {"m": 34, "t": "Quiz: The Human Eye and the Colourful World - M2: Prism Colors and Rainbows", "q": true}, {"m": 35, "t": "Atmospheric Refraction in Real Life", "c": "<p>The Earth's atmosphere bends light because it is not perfectly uniform. That is why stars twinkle and the Sun can seem to rise a little early and set a little late.</p>\n<p>The chapter explains this as atmospheric refraction. The air changes density, light bends repeatedly, and the apparent position of objects can shift a little.</p>\n<ul><li>Twinkling of stars is due to atmospheric refraction.</li><li>Sunrise appears a bit early and sunset a bit late.</li><li>The air is not perfectly steady, so the bending changes slightly.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc110/page_previews/page_0008.png\" alt=\"The atmosphere pages explain twinkling, advanced sunrise, and delayed sunset.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The atmosphere pages explain twinkling, advanced sunrise, and delayed sunset.</p></div>\n<div class=\"tip\"><strong>Friendly image:</strong> the atmosphere is like a moving lens around Earth.</div>"}, {"m": 35, "t": "Scattering Makes the Sky Blue", "c": "<p>Tiny particles in air scatter shorter wavelengths of light more strongly, so blue light reaches our eyes from many directions. That is why the clear sky looks blue.</p>\n<p>The same scattering idea explains the Tyndall effect, the red colour of warning signals in fog, and the glowing path of a beam of light in a smoky room.</p>\n<ul><li>Scattering is the spreading of light by tiny particles.</li><li>Blue light is scattered more strongly than red light.</li><li>Red warning lights are useful because red is scattered less.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc110/page_previews/page_0009.png\" alt=\"The final source pages explain scattering, the blue sky, and why red signals stay visible.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The final source pages explain scattering, the blue sky, and why red signals stay visible.</p></div>\n<div class=\"note\"><strong>Big idea:</strong> the sky's colour is not paint. It is scattered sunlight.</div>"}, {"m": 35, "t": "Quiz: The Human Eye and the Colourful World - M3: Twinkling and Blue Sky", "q": true}, {"m": 36, "t": "A Circuit Needs a Closed Path", "c": "<p>Electric current is the flow of charge through a conductor. The chapter begins by showing that a battery, wire, bulb, and switch must make a closed loop before current can flow.</p>\n<p>If the circuit is broken, the current stops. So the switch simply opens or closes the path that charges can travel through.</p>\n<ul><li>Current is flow of charge.</li><li>A circuit must be closed for current to flow.</li><li>A switch opens or closes the path.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc111/page_previews/page_0001.png\" alt=\"The opening pages introduce current as flowing charge and explain why a circuit must be closed.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The opening pages introduce current as flowing charge and explain why a circuit must be closed.</p></div>\n<div class=\"note\"><strong>Simple picture:</strong> no path, no current.</div>"}, {"m": 36, "t": "Potential Difference Pushes Charges", "c": "<p>Charges do not move on their own in a wire. A cell or battery creates a potential difference, which is like an electric push that keeps charges moving.</p>\n<p>The chapter also introduces the ammeter and voltmeter. An ammeter measures current and is connected in series. A voltmeter measures potential difference and is connected in parallel.</p>\n<ul><li>Potential difference is measured in volts.</li><li>Current is measured in amperes.</li><li>Ammeter is in series; voltmeter is in parallel.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc111/page_previews/page_0002.png\" alt=\"The source pages define current, charge, and potential difference, then show the basic circuit symbols.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The source pages define current, charge, and potential difference, then show the basic circuit symbols.</p></div>\n<div class=\"tip\"><strong>Kid analogy:</strong> voltage is the push, current is the flow.</div>"}, {"m": 36, "t": "Quiz: Electricity - M0: Current and Circuits", "q": true}, {"m": 37, "t": "V and I Move Together", "c": "<p>The chapter studies how potential difference and current are related using a nichrome wire. When the graph of V against I is a straight line through the origin, it shows that V is directly proportional to I.</p>\n<p>That is Ohm's law: V = IR. Here R is resistance, the property that opposes current flow.</p>\n<ul><li>Ohm's law says V is proportional to I.</li><li>The equation is V = IR.</li><li>Resistance controls how much current flows.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc111/page_previews/page_0004.png\" alt=\"The Ohm's law section shows a straight-line V-I graph for a nichrome wire.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The Ohm's law section shows a straight-line V-I graph for a nichrome wire.</p></div>\n<div class=\"real\"><strong>Graph clue:</strong> a straight line through the origin means the ratio V/I stays constant.</div>"}, {"m": 37, "t": "What Changes Resistance", "c": "<p>Resistance depends on the length, thickness, and material of a wire. A longer wire offers more resistance. A thicker wire offers less.</p>\n<p>The chapter also introduces resistivity, which is a material property. It helps compare materials fairly, not just wires of different shapes.</p>\n<ul><li>Longer wire -> more resistance.</li><li>Thicker wire -> less resistance.</li><li>Resistivity helps compare materials themselves.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc111/page_previews/page_0005.png\" alt=\"The source pages discuss resistance, resistivity, and the factors that affect current flow.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The source pages discuss resistance, resistivity, and the factors that affect current flow.</p></div>\n<div class=\"tip\"><strong>Easy memory:</strong> long path, hard trip. Wide path, easier trip.</div>"}, {"m": 37, "t": "Quiz: Electricity - M1: Ohm's Law and Resistance", "q": true}, {"m": 38, "t": "Resistors in Series", "c": "<p>In a series connection, resistors are joined end to end. The same current flows through each one, and the total resistance is the sum of the individual resistances.</p>\n<p>The chapter points out a practical issue too: if one part of a series circuit breaks, the whole circuit stops.</p>\n<ul><li>Series connection means one path.</li><li>Equivalent resistance adds up.</li><li>A break anywhere can stop the whole circuit.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc111/page_previews/page_0007.png\" alt=\"The series-resistor section shows that resistances add and the same current passes through each resistor.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The series-resistor section shows that resistances add and the same current passes through each resistor.</p></div>\n<div class=\"note\"><strong>Remember:</strong> series is like a single-file line.</div>"}, {"m": 38, "t": "Resistors in Parallel", "c": "<p>In a parallel connection, each branch gets the same potential difference. The current splits between the branches, and the equivalent resistance becomes smaller than any one branch resistance.</p>\n<p>That is why homes use parallel wiring. One appliance can be switched off without shutting down every other appliance in the house.</p>\n<ul><li>Parallel connection gives multiple paths.</li><li>Equivalent resistance becomes smaller.</li><li>Devices can work independently in parallel.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc111/page_previews/page_0008.png\" alt=\"The parallel-resistor section explains how current splits and why home wiring is done in parallel.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The parallel-resistor section explains how current splits and why home wiring is done in parallel.</p></div>\n<div class=\"real\"><strong>Household clue:</strong> parallel wiring lets your fan and lamp work separately.</div>"}, {"m": 38, "t": "Quiz: Electricity - M2: Series and Parallel Resistors", "q": true}, {"m": 39, "t": "Current Can Turn Into Heat", "c": "<p>When current flows through a resistor, some electrical energy turns into heat. This is the heating effect of electric current. Devices like heaters, irons, and kettles use that effect on purpose.</p>\n<p>The chapter gives Joule's law of heating: H = I2Rt. That means more current, more resistance, or more time can all increase the heat produced.</p>\n<ul><li>Heating effect means electrical energy becomes heat.</li><li>Joule's law: H = I2Rt.</li><li>Heaters and irons use this effect.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc111/page_previews/page_0010.png\" alt=\"The heating-effect pages show how electrical energy turns into heat in a resistor.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The heating-effect pages show how electrical energy turns into heat in a resistor.</p></div>\n<div class=\"tip\"><strong>Think it through:</strong> a wire can do work or become warm, depending on the circuit.</div>"}, {"m": 39, "t": "Power and Energy Use", "c": "<p>Electric power tells how fast electrical energy is used. The chapter writes power as P = VI, and also as P = I2R or P = V2/R. The unit is watt, and commercial energy is counted in kilowatt-hour.</p>\n<p>That is why appliance labels matter. A 1000 W heater uses energy faster than a 100 W bulb, even though both use the same idea of current and voltage.</p>\n<ul><li>Power = rate of energy use.</li><li>P = VI = I2R = V2/R.</li><li>1 kWh is the commercial unit of electrical energy.</li></ul>\n<div style=\"margin:18px 0 10px;\"><img src=\"../jesc111/page_previews/page_0011.png\" alt=\"The final pages of the chapter define electric power and the kilowatt-hour unit of energy.\" style=\"width:100%;max-height:420px;object-fit:contain;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;\"><p style=\"font-size:0.95rem;color:#475569;margin-top:8px;\">The final pages of the chapter define electric power and the kilowatt-hour unit of energy.</p></div>\n<div class=\"real\"><strong>Money clue:</strong> the electricity bill is really a bill for energy used over time.</div>"}, {"m": 39, "t": "Quiz: Electricity - M3: Heating Effect and Power", "q": true}, {"m": 40, "t": "Electricity can act like a magnet", "c": "<div class=\"note\"><strong>Start here:</strong> Move through the slides first, then use the quiz to check what stuck.</div><p>The chapter begins with a simple clue: current in a wire can move a compass needle.</p><ul><li>A current-carrying wire makes a magnetic effect.</li><li>Oersted's experiment linked electricity and magnetism.</li><li>A compass is the small magnet that reveals the change.</li></ul><div class=\"previews\"><figure class=\"preview\"><img src=\"../jesc112/page_previews/page_0001.png\" alt=\"Page 1 preview\"><figcaption>Page 1</figcaption></figure><figure class=\"preview\"><img src=\"../jesc112/page_previews/page_0002.png\" alt=\"Page 2 preview\"><figcaption>Page 2</figcaption></figure></div>"}, {"m": 40, "t": "Current makes magnetism", "c": "<div class=\"note\"><strong>Module 1:</strong> If the compass moves, the wire is doing more than just carrying charge.</div><p>The first idea is easy to test: when current flows, the wire behaves like a magnet for nearby objects.</p><ul><li>The needle swing is evidence of a magnetic field.</li><li>The effect happens around the wire, not inside the compass.</li><li>Electricity and magnetism are connected ideas.</li></ul><div class=\"previews\"><figure class=\"preview\"><img src=\"../jesc112/page_previews/page_0001.png\" alt=\"Page 1 preview\"><figcaption>Page 1</figcaption></figure><figure class=\"preview\"><img src=\"../jesc112/page_previews/page_0002.png\" alt=\"Page 2 preview\"><figcaption>Page 2</figcaption></figure><figure class=\"preview\"><img src=\"../jesc112/page_previews/page_0003.png\" alt=\"Page 3 preview\"><figcaption>Page 3</figcaption></figure></div>"}, {"m": 40, "t": "Quiz: Magnetic Effects of Electric Current - Current and magnetism", "q": true}, {"m": 41, "t": "Reading magnetic field lines", "c": "<div class=\"note\"><strong>Module 2:</strong> Think of the lines as a map of magnetic push and pull.</div><p>Field lines are drawings that show direction and strength around a magnet.</p><ul><li>Outside the magnet, lines go from north to south.</li><li>Closer lines mean a stronger field.</li><li>Field lines do not cross each other.</li></ul><div class=\"previews\"><figure class=\"preview\"><img src=\"../jesc112/page_previews/page_0003.png\" alt=\"Page 3 preview\"><figcaption>Page 3</figcaption></figure><figure class=\"preview\"><img src=\"../jesc112/page_previews/page_0004.png\" alt=\"Page 4 preview\"><figcaption>Page 4</figcaption></figure><figure class=\"preview\"><img src=\"../jesc112/page_previews/page_0005.png\" alt=\"Page 5 preview\"><figcaption>Page 5</figcaption></figure></div>"}, {"m": 41, "t": "Quiz: Magnetic Effects of Electric Current - Magnetic field lines", "q": true}, {"m": 42, "t": "Wires, coils, and electromagnets", "c": "<div class=\"note\"><strong>Module 3:</strong> A coil plus iron core is the chapter's useful magnet trick.</div><p>Different wire shapes make different field patterns, and a coil with soft iron becomes an electromagnet.</p><ul><li>A straight wire makes circles around it.</li><li>A solenoid acts like a bar magnet.</li><li>Soft iron helps make a stronger electromagnet.</li></ul><div class=\"previews\"><figure class=\"preview\"><img src=\"../jesc112/page_previews/page_0006.png\" alt=\"Page 6 preview\"><figcaption>Page 6</figcaption></figure><figure class=\"preview\"><img src=\"../jesc112/page_previews/page_0007.png\" alt=\"Page 7 preview\"><figcaption>Page 7</figcaption></figure><figure class=\"preview\"><img src=\"../jesc112/page_previews/page_0008.png\" alt=\"Page 8 preview\"><figcaption>Page 8</figcaption></figure></div>"}, {"m": 42, "t": "Quiz: Magnetic Effects of Electric Current - Wires and coils", "q": true}, {"m": 43, "t": "Circuit safety", "c": "<div class=\"note\"><strong>Module 4:</strong> Good wiring is about safety, not just about making things work.</div><p>The last part of the chapter is about staying safe at home with fuses, earth wires, and careful use of power.</p><ul><li>A fuse protects against extra current.</li><li>An earth wire helps stop shocks.</li><li>Too many appliances can overload one circuit.</li></ul><div class=\"previews\"><figure class=\"preview\"><img src=\"../jesc112/page_previews/page_0010.png\" alt=\"Page 10 preview\"><figcaption>Page 10</figcaption></figure><figure class=\"preview\"><img src=\"../jesc112/page_previews/page_0011.png\" alt=\"Page 11 preview\"><figcaption>Page 11</figcaption></figure><figure class=\"preview\"><img src=\"../jesc112/page_previews/page_0012.png\" alt=\"Page 12 preview\"><figcaption>Page 12</figcaption></figure></div>"}, {"m": 43, "t": "Quiz: Magnetic Effects of Electric Current - Safety", "q": true}, {"m": 44, "t": "Nature works as a connected system", "c": "<div class=\"note\"><strong>Start here:</strong> Look for the living parts and the non-living parts together.</div><p>Living things and non-living parts work together in every ecosystem.</p><ul><li>Biotic means living.</li><li>Abiotic means non-living.</li><li>A garden, pond, forest, or aquarium can all be ecosystems.</li></ul><div class=\"previews\"><figure class=\"preview\"><img src=\"../jesc113/page_previews/page_0001.png\" alt=\"Page 1 preview\"><figcaption>Page 1</figcaption></figure><figure class=\"preview\"><img src=\"../jesc113/page_previews/page_0002.png\" alt=\"Page 2 preview\"><figcaption>Page 2</figcaption></figure></div>"}, {"m": 44, "t": "Ecosystems are living neighborhoods", "c": "<div class=\"note\"><strong>Module 1:</strong> The ecosystem works because many parts depend on one another.</div><p>An ecosystem is a place where organisms and surroundings affect each other.</p><ul><li>An aquarium is a human-made ecosystem.</li><li>Producers, consumers, and decomposers all matter.</li><li>Food and shelter link the organisms together.</li></ul><div class=\"previews\"><figure class=\"preview\"><img src=\"../jesc113/page_previews/page_0001.png\" alt=\"Page 1 preview\"><figcaption>Page 1</figcaption></figure><figure class=\"preview\"><img src=\"../jesc113/page_previews/page_0002.png\" alt=\"Page 2 preview\"><figcaption>Page 2</figcaption></figure><figure class=\"preview\"><img src=\"../jesc113/page_previews/page_0003.png\" alt=\"Page 3 preview\"><figcaption>Page 3</figcaption></figure></div>"}, {"m": 44, "t": "Quiz: Our Environment - Ecosystems", "q": true}, {"m": 45, "t": "Food chains and food webs", "c": "<div class=\"note\"><strong>Module 2:</strong> Nature usually looks more like a web than a straight line.</div><p>Energy moves through feeding links. A food web is a connected set of many food chains.</p><ul><li>A food chain shows who eats whom.</li><li>A food web is more realistic than one straight line.</li><li>Trophic levels name each step in the chain.</li></ul><div class=\"previews\"><figure class=\"preview\"><img src=\"../jesc113/page_previews/page_0003.png\" alt=\"Page 3 preview\"><figcaption>Page 3</figcaption></figure><figure class=\"preview\"><img src=\"../jesc113/page_previews/page_0004.png\" alt=\"Page 4 preview\"><figcaption>Page 4</figcaption></figure><figure class=\"preview\"><img src=\"../jesc113/page_previews/page_0005.png\" alt=\"Page 5 preview\"><figcaption>Page 5</figcaption></figure></div>"}, {"m": 45, "t": "Quiz: Our Environment - Food chains and webs", "q": true},
