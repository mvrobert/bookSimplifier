 {"m": 46, "t": "Energy flow", "c": "<div class=\"note\"><strong>Module 3:</strong> Energy moves forward only. It does not circle back.</div><p>Sunlight enters through plants, and only part of the energy moves on at each step.</p><ul><li>Plants capture only a small part of sunlight.</li><li>About 10% of food energy moves to the next level.</li><li>The lowest trophic level usually has the most organisms.</li></ul><div class=\"previews\"><figure class=\"preview\"><img src=\"../jesc113/page_previews/page_0005.png\" alt=\"Page 5 preview\"><figcaption>Page 5</figcaption></figure><figure class=\"preview\"><img src=\"../jesc113/page_previews/page_0006.png\" alt=\"Page 6 preview\"><figcaption>Page 6</figcaption></figure><figure class=\"preview\"><img src=\"../jesc113/page_previews/page_0007.png\" alt=\"Page 7 preview\"><figcaption>Page 7</figcaption></figure></div>"}, {"m": 46, "t": "Quiz: Our Environment - Energy flow", "q": true}, {"m": 47, "t": "Waste, ozone, and better habits", "c": "<div class=\"note\"><strong>Module 4:</strong> Small actions matter when they are repeated every day.</div><p>The chapter ends with practical care: reduce waste, protect the ozone layer, and choose cleaner habits.</p><ul><li>Biodegradable waste breaks down naturally.</li><li>Non-biodegradable waste can build up and cause trouble.</li><li>Cloth bags and turning off unused lights are helpful habits.</li></ul><div class=\"previews\"><figure class=\"preview\"><img src=\"../jesc113/page_previews/page_0008.png\" alt=\"Page 8 preview\"><figcaption>Page 8</figcaption></figure><figure class=\"preview\"><img src=\"../jesc113/page_previews/page_0009.png\" alt=\"Page 9 preview\"><figcaption>Page 9</figcaption></figure><figure class=\"preview\"><img src=\"../jesc113/page_previews/page_0010.png\" alt=\"Page 10 preview\"><figcaption>Page 10</figcaption></figure></div>"}, {"m": 47, "t": "Quiz: Our Environment - Clean habits", "q": true}, {"m": 48, "t": "This is a self-check helper, not a lesson chapter", "c": "<div class=\"note\"><strong>Start here:</strong> Best habit: try first, check second, retry third.</div><p>The source PDF is an answer resource, so this workshop turns it into a friendly revision tool.</p><ul><li>Use it after trying the questions yourself.</li><li>Learn how chapter numbers, option letters, and short answers are shown.</li><li>Turn mistakes into clues for what to revise next.</li></ul><div class=\"previews\"><figure class=\"preview\"><img src=\"../jesc1an/page_previews/page_0001.png\" alt=\"Page 1 preview\"><figcaption>Page 1</figcaption></figure><figure class=\"preview\"><img src=\"../jesc1an/page_previews/page_0002.png\" alt=\"Page 2 preview\"><figcaption>Page 2</figcaption></figure><figure class=\"preview\"><img src=\"../jesc1an/page_previews/page_0003.png\" alt=\"Page 3 preview\"><figcaption>Page 3</figcaption></figure></div>"}, {"m": 48, "t": "Meet the answer key", "c": "<div class=\"note\"><strong>Module 1:</strong> An answer key is a coach, not a shortcut.</div><p>The answer pages are chapter-wise and compact. That makes them good for self-marking, not for copying.</p><ul><li>Chapter numbers help you find the right section quickly.</li><li>Letters like a, b, c, and d show multiple-choice answers.</li><li>Some answers are short phrases instead of letters.</li></ul><div class=\"previews\"><figure class=\"preview\"><img src=\"../jesc1an/page_previews/page_0001.png\" alt=\"Page 1 preview\"><figcaption>Page 1</figcaption></figure></div>"}, {"m": 48, "t": "Quiz: Answer Key Revision Workshop - Using the key", "q": true}, {"m": 49, "t": "How to read the answer patterns", "c": "<div class=\"note\"><strong>Module 2:</strong> Look for the pattern, then ask what the question might have been.</div><p>This resource shows several answer styles, so you can learn what kind of question each one belongs to.</p><ul><li>More than one letter can mean more than one correct option.</li><li>True/False entries come from statement questions.</li><li>Short answers show the key idea you should remember.</li></ul><div class=\"previews\"><figure class=\"preview\"><img src=\"../jesc1an/page_previews/page_0002.png\" alt=\"Page 2 preview\"><figcaption>Page 2</figcaption></figure></div>"}, {"m": 49, "t": "Quiz: Answer Key Revision Workshop - Reading patterns", "q": true}, {"m": 50, "t": "Check, fix, and retry", "c": "<div class=\"note\"><strong>Module 3:</strong> The goal is remembering it later, not just once.</div><p>The best revision happens after a mistake: compare, spot the gap, and try again.</p><ul><li>Mark your own attempt before opening the key.</li><li>Circle the questions you missed.</li><li>Retry after one more quick review.</li></ul><div class=\"previews\"><figure class=\"preview\"><img src=\"../jesc1an/page_previews/page_0002.png\" alt=\"Page 2 preview\"><figcaption>Page 2</figcaption></figure><figure class=\"preview\"><img src=\"../jesc1an/page_previews/page_0003.png\" alt=\"Page 3 preview\"><figcaption>Page 3</figcaption></figure></div>"}, {"m": 50, "t": "Quiz: Answer Key Revision Workshop - Fixing mistakes", "q": true}, {"m": 51, "t": "Fast revision habits", "c": "<div class=\"note\"><strong>Module 4:</strong> Small, steady, honest revision works best.</div><p>A calm routine keeps revision honest and useful.</p><ul><li>Work chapter by chapter.</li><li>Use the key to see what you know well.</li><li>Keep a short list of ideas to revisit.</li></ul><div class=\"previews\"><figure class=\"preview\"><img src=\"../jesc1an/page_previews/page_0001.png\" alt=\"Page 1 preview\"><figcaption>Page 1</figcaption></figure><figure class=\"preview\"><img src=\"../jesc1an/page_previews/page_0002.png\" alt=\"Page 2 preview\"><figcaption>Page 2</figcaption></figure><figure class=\"preview\"><img src=\"../jesc1an/page_previews/page_0003.png\" alt=\"Page 3 preview\"><figcaption>Page 3</figcaption></figure></div>"}, {"m": 51, "t": "Quiz: Answer Key Revision Workshop - Revision habits", "q": true}];
    const MODULE_NAMES = ["Merged Overview", "Acids, Bases and Salts - M0: Colour Clues and Safe Clues", "Acids, Bases and Salts - M1: Reactions and Neutralisation", "Acids, Bases and Salts - M2: The pH Scale", "Acids, Bases and Salts - M3: Helpful Salts in Daily Life", "Metals and Non-metals - M0: Spotting Metals", "Metals and Non-metals - M1: Reactions of Metals and Non-metals", "Metals and Non-metals - M2: Reactivity and Ionic Compounds", "Metals and Non-metals - M3: Corrosion, Alloys and Uses", "Carbon and its Compounds - M0: Why Carbon Is Special", "Carbon and its Compounds - M1: Hydrocarbons and Families", "Carbon and its Compounds - M2: Useful Reactions of Carbon Compounds", "Carbon and its Compounds - M3: Ethanol, Ethanoic Acid and Soap", "Life Processes - M0: What Keeps Living Things Alive", "Life Processes - M1: Respiration and Breathing", "Life Processes - M2: Transport in Bodies and Plants", "Life Processes - M3: Excretion and Balance", "Control and Coordination Workshop - M0: Why the Body Needs Control", "Control and Coordination Workshop - M1: Reflexes and the Brain", "Control and Coordination Workshop - M2: Plants Respond Too", "Control and Coordination Workshop - M3: Hormones Do the Long-Range Work", "How Do Organisms Reproduce? Workshop - M0: Why Reproduction Matters", "How Do Organisms Reproduce? Workshop - M1: Asexual Reproduction", "How Do Organisms Reproduce? Workshop - M2: Sexual Reproduction in Flowering Plants", "How Do Organisms Reproduce? Workshop - M3: Human Reproduction and Health", "Heredity Workshop - M0: Variation and Inheritance", "Heredity Workshop - M1: Mendel's Pea Experiments", "Heredity Workshop - M2: Genes, Chromosomes, and Sex Determination", "Light - M0: Light Helps Us See", "Light - M1: Curved Mirrors and Images", "Light - M2: Refraction in Glass", "Light - M3: Lenses and Focus", "The Human Eye and the Colourful World - M0: Meet the Human Eye", "The Human Eye and the Colourful World - M1: Vision Problems and Fixes", "The Human Eye and the Colourful World - M2: Prism Colors and Rainbows", "The Human Eye and the Colourful World - M3: Twinkling and Blue Sky", "Electricity - M0: Current and Circuits", "Electricity - M1: Ohm's Law and Resistance", "Electricity - M2: Series and Parallel Resistors", "Electricity - M3: Heating Effect and Power", "Magnetic Effects of Electric Current - Current and magnetism", "Magnetic Effects of Electric Current - Magnetic field lines", "Magnetic Effects of Electric Current - Wires and coils", "Magnetic Effects of Electric Current - Safety", "Our Environment - Ecosystems", "Our Environment - Food chains and webs", "Our Environment - Energy flow", "Our Environment - Clean habits", "Answer Key Revision Workshop - Using the key", "Answer Key Revision Workshop - Reading patterns", "Answer Key Revision Workshop - Fixing mistakes", "Answer Key Revision Workshop - Revision habits"];
    const STORE_KEY = 'science_complete_workshop';

    const BOOK_JUMPS = [{"title": "Overview", "label": "Overview", "slideIndex": 0}, {"title": "Acids, Bases and Salts", "label": "Acids, Bases and Salts", "slideIndex": 3}, {"title": "Metals and Non-metals", "label": "Metals and Non-metals", "slideIndex": 15}, {"title": "Carbon and its Compounds", "label": "Carbon and its Compounds", "slideIndex": 27}, {"title": "Life Processes", "label": "Life Processes", "slideIndex": 39}, {"title": "Control and Coordination Workshop", "label": "Control and Coordination Workshop", "slideIndex": 51}, {"title": "How Do Organisms Reproduce? Workshop", "label": "How Do Organisms Reproduce? Workshop", "slideIndex": 63}, {"title": "Heredity Workshop", "label": "Heredity Workshop", "slideIndex": 75}, {"title": "Light", "label": "Light", "slideIndex": 84}, {"title": "The Human Eye and the Colourful World", "label": "The Human Eye and the Colourful World", "slideIndex": 96}, {"title": "Electricity", "label": "Electricity", "slideIndex": 108}, {"title": "Magnetic Effects of Electric Current", "label": "Magnetic Effects of Electric Current", "slideIndex": 120}, {"title": "Our Environment", "label": "Our Environment", "slideIndex": 129}, {"title": "Answer Key Revision Workshop", "label": "Answer Key Revision Workshop", "slideIndex": 138}];

    let cur = 0;
    let quizState = {};
    let failedQs = [];

    function save() {
      const data = { cur, quizState, failedQs, ts: Date.now() };
      try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) {}
      try { document.cookie = STORE_KEY + '=' + cur + ';max-age=31536000;path=/'; } catch (e) {}
    }

    function load() {
      try {
        const data = JSON.parse(localStorage.getItem(STORE_KEY));
        if (data) {
          cur = data.cur || 0;
          quizState = data.quizState || {};
          failedQs = data.failedQs || [];
        }
      } catch (e) {}
    }

    function esc(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function hashSeed(seed) {
      let h = 2166136261;
      for (let i = 0; i < seed.length; i += 1) {
        h ^= seed.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function shuffleOpts(opts, seed) {
      const items = opts.map((text, index) => ({ text, correct: index === 0 }));
      let state = hashSeed(seed) || 1;
      for (let i = items.length - 1; i > 0; i -= 1) {
        state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
        const j = state % (i + 1);
        const tmp = items[i];
        items[i] = items[j];
        items[j] = tmp;
      }
      return items;
    }

    function getModule(moduleId) {
      return QUIZ_DATA.modules.find((module) => module.id === moduleId);
    }

    function ensureQuizState(moduleId) {
      const module = getModule(moduleId);
      if (!quizState[moduleId]) {
        quizState[moduleId] = { answers: {}, score: 0, total: module.questions.length, done: false };
      }
      return quizState[moduleId];
    }

    function renderQuiz(moduleId) {
      const module = getModule(moduleId);
      const state = ensureQuizState(moduleId);
      state.total = module.questions.length;
      state.score = Object.values(state.answers).filter((answer) => answer.correct).length;

      const nextQuestion = module.questions.find((question) => !state.answers[question.id]);
      if (!nextQuestion) {
        state.done = true;
        const pct = Math.round((state.score / state.total) * 100);
        return `
          <div class="quiz-container">
            <h1>${esc(module.name)} Quiz</h1>
            <p class="quiz-meta">You completed ${state.total} questions for this module.</p>
            <div class="${pct >= 70 ? 'quiz-feedback pass show' : 'quiz-feedback fail show'}">
              Score: ${state.score} / ${state.total} (${pct}%).
              Use Retry to revisit questions answered incorrectly.
            </div>
          </div>
        `;
      }

      const questionIndex = module.questions.findIndex((question) => question.id === nextQuestion.id);
      const options = shuffleOpts(nextQuestion.options, nextQuestion.id);

      return `
        <div class="quiz-container">
          <h1>${esc(module.name)} Quiz</h1>
          <p class="quiz-meta">Question ${questionIndex + 1} of ${module.questions.length}</p>
          <h2>${esc(nextQuestion.question)}</h2>
          ${options.map((option, index) => `
            <button class="quiz-opt" id="opt-${index}" onclick="answerQuiz(${moduleId}, '${nextQuestion.id}', ${index})">${esc(option.text)}</button>
          `).join('')}
          <div class="quiz-feedback" id="quiz-feedback"></div>
        </div>
      `;
    }

    function answerQuiz(moduleId, questionId, chosenIndex) {
      const module = getModule(moduleId);
      const state = ensureQuizState(moduleId);
      if (state.answers[questionId]) {
        return;
      }

      const question = module.questions.find((item) => item.id === questionId);
      const options = shuffleOpts(question.options, question.id);
      const chosen = options[chosenIndex];
      const isCorrect = !!chosen.correct;

      state.answers[questionId] = { chosen: chosen.text, correct: isCorrect };
      state.score = Object.values(state.answers).filter((answer) => answer.correct).length;

      if (!isCorrect && !failedQs.some((item) => item.moduleId === moduleId && item.qId === questionId)) {
        failedQs.push({ moduleId, qId: questionId });
      }
      if (Object.keys(state.answers).length === module.questions.length) {
        state.done = true;
      }

      options.forEach((option, index) => {
        const button = document.getElementById(`opt-${index}`);
        if (!button) return;
        button.classList.add('disabled');
        if (option.correct) {
          button.classList.add('correct');
        } else if (index === chosenIndex) {
          button.classList.add('wrong');
        }
      });

      const feedback = document.getElementById('quiz-feedback');
      if (feedback) {
        feedback.className = `quiz-feedback show ${isCorrect ? 'pass' : 'fail'}`;
        feedback.innerHTML = `<strong>${isCorrect ? 'Correct.' : 'Not quite.'}</strong> ${esc(question.explanation)}`;
      }

      save();
      setTimeout(render, isCorrect ? 1200 : 3000);
    }

    function retryFailed() {
      if (!failedQs.length) {
        alert('No failed quiz questions are currently tracked.');
        return;
      }

      const retryItems = failedQs.slice();
      retryItems.forEach((item) => {
        const state = ensureQuizState(item.moduleId);
        delete state.answers[item.qId];
        state.score = Object.values(state.answers).filter((answer) => answer.correct).length;
        state.done = false;
      });

      const first = retryItems[0];
      failedQs = [];
      cur = SLIDES.findIndex((slide) => slide.q && slide.m === first.moduleId);
      render();
    }

    function go(dir) {
      cur = Math.max(0, Math.min(SLIDES.length - 1, cur + dir));
      render();
    }

    function jump(index) {
      cur = index;
      render();
      toggleTOC(false);
    }

    function toggleTOC(force) {
      const toc = document.getElementById('toc');
      const overlay = document.getElementById('toc-overlay');
      const shouldOpen = typeof force === 'boolean' ? force : !toc.classList.contains('open');
      toc.classList.toggle('open', shouldOpen);
      overlay.classList.toggle('open', shouldOpen);
    }

    function buildTOC() {
      const tocBody = document.getElementById('toc-body');
      const html = MODULE_NAMES.map((moduleName, moduleIndex) => {
        const links = SLIDES.map((slide, slideIndex) => ({ slide, slideIndex }))
          .filter((entry) => entry.slide.m === moduleIndex)
          .map((entry) => `
            <button class="toc-link ${entry.slideIndex === cur ? 'current' : ''}" onclick="jump(${entry.slideIndex})">
              ${entry.slide.q ? 'Quiz' : esc(entry.slide.t)}
            </button>
          `)
          .join('');
        return `<div class="toc-module"><h3>${esc(moduleName)}</h3>${links}</div>`;
      }).join('');
      tocBody.innerHTML = html;
    }

    function renderBookJumpBar() {
      const bar = document.getElementById('book-jump-bar');
      if (!bar) {
        return;
      }
      let currentBook = 0;
      for (let i = 0; i < BOOK_JUMPS.length; i += 1) {
        if (cur >= BOOK_JUMPS[i].slideIndex) {
          currentBook = i;
        } else {
          break;
        }
      }
      bar.innerHTML = BOOK_JUMPS.map((entry, index) => `
        <button class="book-jump ${index === currentBook ? 'current' : ''}" onclick="jump(${entry.slideIndex})" title="${esc(entry.title)}">
          ${esc(entry.label)}
        </button>
      `).join('');
    }

    function render() {
      const slide = SLIDES[cur];
      const progress = Math.round(((cur + 1) / SLIDES.length) * 100);
      document.getElementById('progress-bar').style.width = progress + '%';
      document.getElementById('pct').textContent = progress + '%';
      document.getElementById('slide-counter').textContent = `${cur + 1} / ${SLIDES.length}`;
      document.getElementById('module-label').textContent = MODULE_NAMES[slide.m];
      document.getElementById('slide').innerHTML = slide.q ? renderQuiz(slide.m) : `<h1>${esc(slide.t)}</h1>${slide.c}`;
      save();
      renderBookJumpBar();
      buildTOC();
    }

    document.addEventListener('keydown', (event) => {
      const tag = (event.target && event.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') {
        return;
      }
      if (event.key === ' ' && !event.shiftKey) {
        event.preventDefault();
        go(1);
      } else if ((event.key === ' ' && event.shiftKey) || event.key === 'ArrowLeft') {
        event.preventDefault();
        go(-1);
      } else if (event.key === 'ArrowRight') {
        event.preventDefault();
        go(1);
      } else if (event.key === 'Home') {
        event.preventDefault();
        cur = 0;
        render();
      } else if (event.key === 'End') {
        event.preventDefault();
        cur = SLIDES.length - 1;
        render();
      } else if (event.key === 't' || event.key === 'T') {
        event.preventDefault();
        toggleTOC();
      } else if (event.key === 'r' || event.key === 'R') {
        event.preventDefault();
        retryFailed();
      }
    });

    load();
    render();
  </script>
</body>
</html>
